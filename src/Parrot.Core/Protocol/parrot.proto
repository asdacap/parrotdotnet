syntax = "proto3";

option csharp_namespace = "Parrot.Protocol";

package parrot.v1;

// The whole product is this service. Both CLIs are clients of it.
//
// Sending and listening are separate calls on purpose: a prompt is durable
// before execution is requested (principle 1), so admitting one must not
// depend on anyone listening, and a client that reconnects must be able to
// resume the stream without re-sending the prompt.
service Parrot {
  rpc ListModels (ListModelsRequest) returns (ListModelsResponse);
  rpc CreateSession (CreateSessionRequest) returns (Session);
  rpc UpdateSession (UpdateSessionRequest) returns (Session);
  rpc SendMessage (SendMessageRequest) returns (SendMessageResponse);
  rpc Listen (ListenRequest) returns (stream Event);
}

// The model is session state, not a property of a message: selection belongs
// to the session (see AgentSession in components.md), so changing it is an
// explicit UpdateSession rather than a different value on the next prompt.
message Session {
  string id                = 1;
  string model             = 2;
  string parent_session_id = 3;
}

message CreateSessionRequest {
  string model             = 1;
  string parent_session_id = 2;
}

message UpdateSessionRequest {
  string id    = 1;
  string model = 2;
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated Model models = 1;
}

message Model {
  string id          = 1;
  string provider_id = 2;
}

message SendMessageRequest {
  string session_id = 1;
  string text       = 2;
}

message SendMessageResponse {
  string message_id = 1;
}

message ListenRequest {
  string session_id = 1;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_TURN_START  = 1;
  EVENT_KIND_TEXT        = 2;
  EVENT_KIND_REASONING   = 3;
  EVENT_KIND_TOOL_CALL   = 4;
  EVENT_KIND_RETRY       = 5;
  EVENT_KIND_TURN_END    = 6;
  EVENT_KIND_ERROR       = 7;
}

// Flat, and named by its session.
//
// There is deliberately no task_id. Nothing starts a task yet -- no shell, no
// subagents -- so the field would carry a fabricated id that no client could
// use and no test could exercise. It arrives with tasks at M5, where a task
// belongs to the session that started it and tasks do not nest.
message Event {
  string    id         = 1;
  string    session_id = 2;
  EventKind kind       = 3;
  // One rendered line, on every event. BasicCli needs nothing else, and an
  // event whose text cannot be written is one whose meaning is not decided.
  string    text       = 4;

  // Typed detail for EnhancedCli, which ignores text and reads this. Both
  // clients stay honest because neither can compensate for the other.
  oneof payload {
    TurnStarted     turn_started     = 5;
    TextChunk       text_chunk       = 6;
    ReasoningChunk  reasoning_chunk  = 7;
    ToolCallChunk   tool_call_chunk  = 8;
    RetryNotice     retry_notice     = 9;
    TurnEnded       turn_ended       = 10;
    TurnFailed      turn_failed      = 11;
  }
}

message TurnStarted {
  string model = 1;
}

message TextChunk {
  string fragment = 1;
}

message ReasoningChunk {
  string fragment = 1;
}

message ToolCallChunk {
  string tool_call_id       = 1;
  string tool_name          = 2;
  string arguments_fragment = 3;
}

message RetryNotice {
  int32  attempt        = 1;
  int32  retry_after_ms = 2;
  string reason         = 3;
}

message TurnEnded {
  string finish_reason = 1;
  int32  input_tokens  = 2;
  int32  output_tokens = 3;
}

message TurnFailed {
  string message = 1;
}
