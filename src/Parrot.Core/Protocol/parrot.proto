syntax = "proto3";

option csharp_namespace = "Parrot.Protocol";

package parrot.v1;

// The whole product is this service. Both CLIs are clients of it.
//
// Sending and listening are separate calls on purpose: a prompt is durable
// before execution is requested (principle 1), so admitting one must not
// depend on anyone listening, and a client that reconnects must be able to
// resume the stream without re-sending the prompt.
service Parrot {
  rpc ListModels (ListModelsRequest) returns (ListModelsResponse);
  rpc CreateSession (CreateSessionRequest) returns (UserSession);
  rpc UpdateSession (UpdateSessionRequest) returns (UserSession);
  rpc SendMessage (SendMessageRequest) returns (SendMessageResponse);
  rpc Interrupt (InterruptRequest) returns (InterruptResponse);
  rpc Listen (ListenRequest) returns (stream Event);
}

// A UserSession, which is what the API deals in: one working directory's
// session, owning its database and its event stream.
//
// AgentSessions live inside it and are not addressable here. A user never
// spawns a subagent -- an agent does, into a background child session whose
// events surface on this same stream -- so there is no parent id on this
// message and no way to ask for one.
//
// The model is session state, not a property of a message, so changing it is
// an explicit UpdateSession rather than a different value on the next prompt.
message UserSession {
  string id    = 1;
  string model = 2;
}

message CreateSessionRequest {
  string model = 1;
}

message UpdateSessionRequest {
  string user_session_id = 1;
  string model           = 2;
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated Model models = 1;
}

message Model {
  string id          = 1;
  string provider_id = 2;
}

// When an admitted prompt is promoted into the conversation.
//
// Unspecified is refused rather than defaulted. A default would decide, on the
// sender's behalf and silently, whether their message interrupts the work in
// flight or waits for it -- and those are different requests.
enum Delivery {
  DELIVERY_UNSPECIFIED = 0;
  // At the next turn boundary, so it joins the turn already running.
  DELIVERY_STEER       = 1;
  // When the turn would otherwise stop, so it starts a turn of its own.
  DELIVERY_QUEUE       = 2;
}

// The message id is the sender's, not the server's: re-sending after a dropped
// connection must not admit the prompt twice, and only the sender knows that
// the second send is the same prompt. One is minted when the field is empty.
message SendMessageRequest {
  string   user_session_id = 1;
  string   text            = 2;
  string   message_id      = 3;
  Delivery delivery        = 4;
}

// Created distinguishes an admission from a replay of one. Both are success:
// the prompt is admitted either way, which is what the sender asked for.
message SendMessageResponse {
  string message_id = 1;
  string input_id   = 2;
  bool   created    = 3;
}

// Stops the turn in flight. It returns once the drain has unwound and every
// tool call has settled, so a caller that immediately sends again cannot race
// the turn it just stopped.
//
// Input admitted but not yet promoted survives: the drain resumes for it
// rather than making the user ask twice.
message InterruptRequest {
  string user_session_id = 1;
}

message InterruptResponse {}

message ListenRequest {
  string user_session_id = 1;
}

// Flat, and named by its session.
//
// The payload is the discriminator. There is no separate kind enum: it would
// be a second source of truth that can disagree with the payload, and every
// reader already switches on the payload to get at the fields it needs.
//
// There is likewise no rendered text field. Each payload carries only what it
// means, and a client renders it. A server-side line would be a second
// rendering that no client is obliged to use and that drifts from the payload.
//
// There is deliberately no task_id. Nothing starts a task yet -- no shell, no
// subagents -- so the field would carry a fabricated id that no client could
// use and no test could exercise. It arrives with tasks at M5, where a task
// belongs to the session that started it and tasks do not nest.
message Event {
  string id              = 1;
  // The agent session that produced it, which may be a background subagent.
  string agent_session_id = 2;

  oneof payload {
    TurnStarted     turn_started     = 3;
    TextChunk       text_chunk       = 4;
    ReasoningChunk  reasoning_chunk  = 5;
    ToolCallChunk   tool_call_chunk  = 6;
    RetryNotice     retry_notice     = 7;
    TurnEnded       turn_ended       = 8;
    TurnFailed      turn_failed      = 9;
    InputAdmitted   input_admitted   = 10;
    InputPromoted   input_promoted   = 11;
  }
}

// The user's own prompt, accepted but not yet part of the conversation. It is
// on the stream because more than one client can watch a session, and a client
// that did not send the prompt has no other way to learn of it.
message InputAdmitted {
  string   input_id   = 1;
  string   message_id = 2;
  string   content    = 3;
  Delivery delivery   = 4;
}

// The same prompt, now in the conversation. The content is not repeated: the
// admission carried it, and a second copy could disagree with the first.
message InputPromoted {
  string input_id   = 1;
  string message_id = 2;
}

message TurnStarted {
  string model = 1;
}

message TextChunk {
  string fragment = 1;
}

message ReasoningChunk {
  string fragment = 1;
}

message ToolCallChunk {
  string tool_call_id       = 1;
  string tool_name          = 2;
  string arguments_fragment = 3;
}

message RetryNotice {
  int32  attempt        = 1;
  int32  retry_after_ms = 2;
  string reason         = 3;
}

// An interrupted turn ends here too, with finish_reason "interrupted". It is
// not a separate payload: the turn stopped, and a second way to say so is a
// second thing every client must learn to read.
message TurnEnded {
  string finish_reason = 1;
  int32  input_tokens  = 2;
  int32  output_tokens = 3;
}

message TurnFailed {
  string message = 1;
}
