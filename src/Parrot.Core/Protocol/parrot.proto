syntax = "proto3";

option csharp_namespace = "Parrot.Protocol";

package parrot.v1;

// The whole product is this service. Both CLIs are clients of it.
//
// Sending and listening are separate calls on purpose: a prompt is durable
// before execution is requested (principle 1), so admitting one must not
// depend on anyone listening, and a client that reconnects must be able to
// resume the stream without re-sending the prompt.
service Parrot {
  rpc ListModels (ListModelsRequest) returns (ListModelsResponse);
  rpc ListModelAliases (ListModelAliasesRequest) returns (ListModelAliasesResponse);
  rpc ConfigureModelAlias (ConfigureModelAliasRequest) returns (ConfigureModelAliasResponse);
  rpc ListModes (ListModesRequest) returns (ListModesResponse);
  rpc ListSessions (ListSessionsRequest) returns (ListSessionsResponse);
  rpc CreateSession (CreateSessionRequest) returns (UserSession);
  rpc UpdateSession (UpdateSessionRequest) returns (UserSession);
  rpc SendMessage (SendMessageRequest) returns (SendMessageResponse);
  rpc Interrupt (InterruptRequest) returns (InterruptResponse);
  rpc ListPendingQuestions (ListPendingQuestionsRequest) returns (ListPendingQuestionsResponse);
  rpc ReplyQuestion (ReplyQuestionRequest) returns (ReplyQuestionResponse);
  rpc RejectQuestion (RejectQuestionRequest) returns (RejectQuestionResponse);
  rpc ListPendingPermissions (ListPendingPermissionsRequest) returns (ListPendingPermissionsResponse);
  rpc ReplyPermission (ReplyPermissionRequest) returns (ReplyPermissionResponse);
  rpc Listen (ListenRequest) returns (stream Event);
}

// A UserSession, which is what the API deals in: one working directory's
// session, owning its database and its event stream.
//
// AgentSessions live inside it and are not addressable here. A user never
// spawns a subagent -- an agent does, into a background child session whose
// events surface on this same stream -- so there is no parent id on this
// message and no way to ask for one.
//
// The model is session state, not a property of a message, so changing it is
// an explicit UpdateSession rather than a different value on the next prompt.
message UserSession {
  string id    = 1;
  string model = 2;
  string mode  = 3;
  bool loaded  = 4;
}

message CreateSessionRequest {
  string model = 1;
  string mode  = 2;
  bool interactive_permissions = 3;
}

message UpdateSessionRequest {
  string user_session_id = 1;
  string model           = 2;
  string mode            = 3;
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated Model models = 1;
}

message Model {
  string id                    = 1;
  string provider_id           = 2;
  repeated ModelVariant variants = 3;
}

message ModelVariant {
  string name             = 1;
  string reasoning_effort = 2;
}

message ListModelAliasesRequest {}

message ListModelAliasesResponse {
  repeated ModelAlias aliases = 1;
}

message ModelAlias {
  string name         = 1;
  string model_string = 2;
  string usage        = 3;
}

message ConfigureModelAliasRequest {
  string name         = 1;
  string model_string = 2;
}

message ConfigureModelAliasResponse {
  ModelAlias alias = 1;
}

message ListModesRequest {}

message ListModesResponse {
  repeated Mode modes = 1;
}

message Mode {
  string id = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
}

message SessionSummary {
  string user_session_id = 1;
  string model = 2;
  string mode = 3;
  string created_at = 4;
  SessionState state = 5;
  string root_agent_name = 6;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_ACTIVE = 1;
  SESSION_STATE_INACTIVE = 2;
  SESSION_STATE_CORRUPT = 3;
}

// When an admitted prompt is promoted into the conversation.
//
// Unspecified is refused rather than defaulted. A default would decide, on the
// sender's behalf and silently, whether their message interrupts the work in
// flight or waits for it -- and those are different requests.
enum Delivery {
  DELIVERY_UNSPECIFIED = 0;
  // At the next turn boundary, so it joins the turn already running.
  DELIVERY_STEER       = 1;
  // When the turn would otherwise stop, so it starts a turn of its own.
  DELIVERY_QUEUE       = 2;
}

// The message id is the sender's, not the server's: re-sending after a dropped
// connection must not admit the prompt twice, and only the sender knows that
// the second send is the same prompt. One is minted when the field is empty.
message SendMessageRequest {
  string   user_session_id = 1;
  string   text            = 2;
  string   message_id      = 3;
  Delivery delivery        = 4;
}

// Created distinguishes an admission from a replay of one. Both are success:
// the prompt is admitted either way, which is what the sender asked for.
message SendMessageResponse {
  string message_id = 1;
  string input_id   = 2;
  bool   created    = 3;
}

// Stops the turn in flight. It returns once the drain has unwound and every
// tool call has settled, so a caller that immediately sends again cannot race
// the turn it just stopped.
//
// Input admitted but not yet promoted survives: the drain resumes for it
// rather than making the user ask twice.
message InterruptRequest {
  string user_session_id = 1;
}

message InterruptResponse {}

message ListPendingQuestionsRequest {
  string user_session_id = 1;
}

message ListPendingQuestionsResponse {
  repeated PendingQuestion questions = 1;
}

message PendingQuestion {
  string id = 1;
  repeated QuestionDefinition questions = 2;
}

message QuestionDefinition {
  string id = 1;
  string header = 2;
  string prompt = 3;
  repeated QuestionOption options = 4;
  bool multiple = 5;
  bool custom = 6;
}

message QuestionOption {
  string id = 1;
  string label = 2;
}

message QuestionAnswer {
  string question_id = 1;
  repeated string option_ids = 2;
  string custom = 3;
}

message ReplyQuestionRequest {
  string user_session_id = 1;
  string question_request_id = 2;
  repeated QuestionAnswer answers = 3;
}

message ReplyQuestionResponse {}

message RejectQuestionRequest {
  string user_session_id = 1;
  string question_request_id = 2;
}

message RejectQuestionResponse {}

message ListPendingPermissionsRequest {
  string user_session_id = 1;
}

message ListPendingPermissionsResponse {
  repeated PendingPermission permissions = 1;
}

message PendingPermission {
  string id = 1;
  string agent_session_id = 2;
  string reason = 3;
  repeated PermissionTarget targets = 4;
  repeated PermissionChoice choices = 5;
}

enum PermissionTargetKind {
  PERMISSION_TARGET_KIND_UNSPECIFIED = 0;
  PERMISSION_TARGET_KIND_FILE = 1;
  PERMISSION_TARGET_KIND_DIRECTORY = 2;
}

enum PermissionTargetScope {
  PERMISSION_TARGET_SCOPE_UNSPECIFIED = 0;
  PERMISSION_TARGET_SCOPE_WRITE = 1;
}

message PermissionTarget {
  PermissionTargetKind kind = 1;
  PermissionTargetScope scope = 2;
  string path = 3;
}

enum PermissionAction {
  PERMISSION_ACTION_UNSPECIFIED = 0;
  PERMISSION_ACTION_ALLOW = 1;
  PERMISSION_ACTION_DENY = 2;
}

message PermissionChoice {
  string value = 1;
  string label = 2;
  PermissionAction action = 3;
  bool requires_reason = 4;
}

message ReplyPermissionRequest {
  string user_session_id = 1;
  string permission_request_id = 2;
  string choice_value = 3;
  string reason = 4;
}

message ReplyPermissionResponse {}

message ListenRequest {
  string user_session_id = 1;
}

// Flat, and named by its session.
//
// The payload is the discriminator. There is no separate kind enum: it would
// be a second source of truth that can disagree with the payload, and every
// reader already switches on the payload to get at the fields it needs.
//
// There is likewise no rendered text field. Each payload carries only what it
// means, and a client renders it. A server-side line would be a second
// rendering that no client is obliged to use and that drifts from the payload.
//
// There is deliberately no task_id. Nothing starts a task yet -- no shell, no
// subagents -- so the field would carry a fabricated id that no client could
// use and no test could exercise. It arrives with tasks at M5, where a task
// belongs to the session that started it and tasks do not nest.
message Event {
  string id              = 1;
  // The agent session that produced it, which may be a background subagent.
  string agent_session_id = 2;

  oneof payload {
    TurnStarted     turn_started     = 3;
    TextChunk       text_chunk       = 4;
    ReasoningChunk  reasoning_chunk  = 5;
    ToolCallChunk   tool_call_chunk  = 6;
    RetryNotice     retry_notice     = 7;
    TurnEnded       turn_ended       = 8;
    TurnFailed      turn_failed      = 9;
    InputAdmitted   input_admitted   = 10;
    InputPromoted   input_promoted   = 11;
    ToolStarted     tool_started     = 12;
    ToolFinished    tool_finished    = 13;
    ToolCancelled   tool_cancelled   = 14;
    ToolError       tool_error       = 15;
    AgentStarted    agent_started    = 16;
    AgentFinished   agent_finished   = 17;
    AgentFailed     agent_failed     = 18;
    TodoUpdated             todo_updated             = 19;
    StatusInjected         status_injected          = 20;
    AgentStatisticsUpdatedEvent agent_statistics_updated = 21;
    PlanCompleted          plan_completed          = 22;
    PendingPermission      permission_pending      = 23;
  }
}

message AgentStarted {
  string parent_agent_session_id = 1;
  string name                    = 2;
}

message AgentFinished {
  string parent_agent_session_id = 1;
  string name                    = 2;
}

message AgentFailed {
  string parent_agent_session_id = 1;
  string name                    = 2;
  string message                 = 3;
}

message TodoUpdated {
  repeated TodoState todos = 1;
}

message TodoState {
  string id       = 1;
  string content  = 2;
  string status   = 3;
  string priority = 4;
  int32 position  = 5;
}

// Transient notification that the durable runtime status system message was
// added to model history. Its text is deliberately not duplicated on the wire.
message StatusInjected {}

message AgentStatisticsUpdatedEvent {
  int64  input_tokens        = 1;
  int64  cached_input_tokens = 2;
  int64  output_tokens       = 3;
  int64  context_size        = 4;
  int64  context_limit       = 5;
  double input_cost          = 6;
  double output_cost         = 7;
}

// The user's own prompt, accepted but not yet part of the conversation. It is
// on the stream because more than one client can watch a session, and a client
// that did not send the prompt has no other way to learn of it.
message InputAdmitted {
  string   input_id   = 1;
  string   message_id = 2;
  string   content    = 3;
  Delivery delivery   = 4;
}

// The same prompt, now in the conversation. The content is not repeated: the
// admission carried it, and a second copy could disagree with the first.
message InputPromoted {
  string input_id   = 1;
  string message_id = 2;
}

message TurnStarted {
  string         model            = 1;
  TurnModelAliasIcon model_alias_icon = 2;
}

message TurnModelAliasIcon {
  reserved 3;
  reserved "muted";

  string                  glyph = 1;
  TurnModelAliasIconColor color = 2;
}

enum TurnModelAliasIconColor {
  TURN_MODEL_ALIAS_ICON_COLOR_BLACK   = 0;
  TURN_MODEL_ALIAS_ICON_COLOR_RED     = 1;
  TURN_MODEL_ALIAS_ICON_COLOR_GREEN   = 2;
  TURN_MODEL_ALIAS_ICON_COLOR_YELLOW  = 3;
  TURN_MODEL_ALIAS_ICON_COLOR_BLUE    = 4;
  TURN_MODEL_ALIAS_ICON_COLOR_MAGENTA = 5;
  TURN_MODEL_ALIAS_ICON_COLOR_CYAN    = 6;
  TURN_MODEL_ALIAS_ICON_COLOR_WHITE   = 7;
  TURN_MODEL_ALIAS_ICON_COLOR_GRAY    = 8;
}

message TextChunk {
  string fragment = 1;
}

enum ReasoningKind {
  REASONING_KIND_RAW     = 0;
  REASONING_KIND_SUMMARY = 1;
}

message ReasoningChunk {
  string        fragment  = 1;
  ReasoningKind kind      = 2;
  string        part_id   = 3;
  bool          completed = 4;
}

message ToolCallChunk {
  string tool_call_id       = 1;
  string tool_name          = 2;
  string arguments_fragment = 3;
}

message ToolStarted {
  string tool_call_id = 1;
  string tool_name    = 2;
}

message ToolFinished {
  string tool_call_id  = 1;
  string tool_name     = 2;
  optional string result = 3;
}

message ToolCancelled {
  string tool_call_id = 1;
  string tool_name    = 2;
}

message ToolError {
  string tool_call_id = 1;
  string tool_name    = 2;
  string message      = 3;
}

message RetryNotice {
  int32  attempt        = 1;
  int32  retry_after_ms = 2;
  string reason         = 3;
}

// An interrupted turn ends here too, with finish_reason "interrupted". It is
// not a separate payload: the turn stopped, and a second way to say so is a
// second thing every client must learn to read.
message TurnEnded {
  string finish_reason = 1;
  int64  input_tokens  = 2;
  int64  output_tokens = 3;
}

message PlanCompleted {
  string agent_session_id = 1;
  string message_id = 2;
  string markdown = 3;
  TurnCompleteDialog dialog = 4;
}

message TurnCompleteDialog {
  string prompt = 1;
  repeated string context = 2;
  repeated DialogChoice choices = 3;
  string custom_choice = 4;
  string custom_description = 5;
  string custom_prompt = 6;
  string empty_message = 7;
}

message DialogChoice {
  string value = 1;
  string description = 2;
  repeated string aliases = 3;
  ChoiceAction action = 4;
}

message ChoiceAction {
  string mode = 1;
  string prompt = 2;
}

message TurnFailed {
  string message = 1;
}
