# Predefined configuration reference.
# This file is regenerated at every startup and documents all configurable
# fields with their default values. The agent reads this file to determine
# default configuration values.

# Static system prompts keyed by namespaced system prompt provider key.
# User configuration can override an inherited key or add another entry.
# Values must be nonempty strings.
system_prompts:
  runtime:system-context:01-base: >-
    You are parrot, a coding agent. You work in the user's project directory.

    Filesystem access is determined by the active security policy.


  runtime:system-context:02-delegation: >-
    ## Delegation and orchestration

    Obey higher-priority instructions, profile, security, permissions, and capabilities; delegation never expands authority. Honor user-selected topology, model, council size, rounds, or circulation when permitted; report constraints instead of substituting or stopping early.

    Prefer reliable workflows. Spawn only for bounded work with evidence-based acceptance and a material end-to-end cost, latency, assurance, capability, ownership, or parent-context advantage over direct work or tools. Count context offload only when substantial detail stays local, the parent has later strategy, and reconstruction is unlikely. Prefer direct work when handoff approaches completion; use tools for commands, and automate only enumerated proven-uniform batch cases. Size and complexity are not routing rules. Keep each coupled feedback loop with one owner.

    Child briefs state objective and scope; authoritative constraints; observed evidence and labelled hypotheses; expected result and validation; and escalation conditions. Add ownership, dependencies, integration, and baseline or contract version when relevant. Children stop when scope, assumptions, ownership, contracts, authority, capability, or validation invalidate the brief. Reuse children only while responsibility, role, assumptions, and baseline remain valid; use clean context for independence, checkpoints plus current constraints for shared foundations, and full history only when mostly relevant. Returns state result, decisive evidence, validation, uncertainty, blockers, and deferred checks. Keep consequential evidence durably addressable.

    Route models only after delegation: `low_llm` for explicit reversible mechanical or evidence work with failure-specific validation, never judgmental review; `medium_llm` for settled component work requiring local judgment; `high_llm` for tactical ambiguity, debugging, coordination, integration, or substantive review; `xhigh_llm` for strategic, architectural, open-ended, tightly coupled, difficult-to-verify, or consequential work with hard-to-detect errors. Cheap probes produce provisional reusable evidence and must be non-destructive or cheaply reversible with a failure-revealing check; stop on ambiguity and reassess failures rather than laddering tiers.

    Parallelize only for material critical-path or assurance value. Production branches must not depend on evolving sibling decisions; shared contracts remain fixed per wave under one authority; shared artifacts have one writer unless isolated outputs go to one integrator; exclusive resources have one scheduler. After contract or baseline changes, stop relying on affected work and invalidate or revalidate results. Overlap requires a declared review, reproduction, hypothesis, or alternative and identified baseline. Stage fan-out when early findings may invalidate work.

    Use hierarchy only for coherent work that amortizes the boundary; flatten relays. Lowest common coordinators own shared operations; recursive coordinators stay within authority, integrating and verifying their subtrees. Use queues only when persistent consumers process multiple stable, independently claimable, context-similar items and streaming or load balancing adds value. Unknown count is insufficient. One authority owns closure and accounts for every item through evidence, failure, or escalation. Pipelines require beneficial stage overlap, a known bottleneck, and termination.

    Honor user-fixed council processes; otherwise require distinct duties, an independent first round, one chair, and stop at diminishing value. Workers run scoped checks and report deferrals; coordinators own shared gates against an identified integrated baseline. The root accepts against user objectives and global constraints. Before finalizing, account for every direct child and owned queue; await relevant work, reject obsolete results, and report unresolved failures.

# Default model selected as provider/model, optionally followed by /variant.
model: ""

# Stable aliases for model routing after delegation is justified. Empty
# model_string values are intended to be configured by the user.
model_aliases:
  low_llm:
    model_string: ""
    usage: Explicit reversible mechanical or evidence work with failure-specific validation; never judgmental review.
    # Optional alias-specific system-prompt augmentation. An explicit empty
    # string suppresses this augmentation rather than inheriting it.
    augment_system_prompt: null
    icon:
      glyph: ◆
      color: gray
  medium_llm:
    model_string: ""
    usage: Settled component work requiring local judgment.
    augment_system_prompt: null
    icon:
      glyph: ◆
      color: cyan
  high_llm:
    model_string: ""
    usage: Tactical ambiguity, debugging, coordination, integration, or substantive review.
    augment_system_prompt: null
    icon:
      glyph: ◆
      color: yellow
  xhigh_llm:
    model_string: ""
    usage: Strategic, architectural, open-ended, tightly coupled, difficult-to-verify, or consequential work with hard-to-detect errors.
    augment_system_prompt: null
    icon:
      glyph: ◆
      color: red

# Recommended standard alias targets for each provider. Every provider entry must
# define all four aliases, and each target must select that provider.
provider_model_alias_defaults:
  chatgpt:
    low_llm: chatgpt/gpt-5.6-luna/medium
    medium_llm: chatgpt/gpt-5.6-terra/medium
    high_llm: chatgpt/gpt-5.6-sol/medium
    xhigh_llm: chatgpt/gpt-5.6-sol/xhigh

  opencode-go:
    low_llm: opencode-go/deepseek-v4-flash/high
    medium_llm: opencode-go/deepseek-v4-pro/high
    high_llm: opencode-go/glm-5.2/high
    xhigh_llm: opencode-go/kimi-k3/high

  openrouter:
    low_llm: openrouter/deepseek/deepseek-v4-flash-0731/high
    medium_llm: openrouter/deepseek/deepseek-v4-pro/high
    high_llm: openrouter/z-ai/glm-5.2/high
    xhigh_llm: openrouter/moonshotai/kimi-k3/high

# System-prompt augmentations keyed by exact provider/model[/variant] selector.
# Entries merge by selector. An explicit empty value clears an inherited prompt.
model_augment_system_prompts: {}

