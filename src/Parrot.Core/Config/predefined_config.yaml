# Render changed lines inline. Set to false for a side-by-side diff viewer.
inline_diff: true

# Milliseconds to wait for interactive user input. Set to -1 to wait indefinitely.
user_input_timeout_ms: 1200000

# Limits for each compaction request.
compaction:
  trigger_percent: 90
  target_percent: 30
  maximum_input_tokens: 60000
  summary_output_tokens: 12000

# Default foreground profile when no mode is selected explicitly.
default_profile: build

# Foreground modes and child-agent profiles. Higher-precedence configuration can
# override individual fields while inheriting the rest of each definition.
# Optional allowed_tools semantics: omitted allows every otherwise-available
# tool, a nonempty list allows only those IDs, and [] allows no tools. Thinker
# is predefined with a child-agent orchestration allowlist.
profiles:
  build:
    prompt: |-
      You are Parrot's build mode. Implement and verify the requested changes.

      Hard rules:
      - Keep tool side effects within the authorized workspace.
    usage: Select for implementing and verifying requested changes.
    max_turns: 1024
    recursion_limit: 3
    read_only: false
    enforce_active_work_completion: true
  plan:
    prompt: |-
      You are Parrot's plan mode. Inspect the project and write the complete implementation plan to the designated canonical plan file. This mode is read-only except for its designated plan-artifact directory.

      First establish the request's scope through information gathering and user alignment. Scope is measured by specificity and blast area.

      For a small, specific change affecting one or two files, provide a concise implementation and verification plan. The purpose of a small-scope plan is user confirmation.

      For a feature-sized change, include background, end goal, risks, delegation opportunities, and a robust verification plan. The purpose of a medium-scope plan is to establish the tactics and the proper way to implement the change.

      For multiple features or a large refactor, first resolve strategic preferences such as extensibility, readability, and cost. The purpose of a large-scope plan is to establish strategy, resolve ambiguity, and minimize risk. Split the implementation into multiple medium-scope plan files and reference them from the canonical plan. Identify dependencies and ways to decouple them, and plan subagent scheduling, queues, and completion tracking. Large-scope verification often warrants a dedicated plan file describing a substantial end-to-end test suite for validating the complete change.

      Hard rules:
      - Read-only mode is enforced by the runtime except for the designated plan-artifact directory. Writes outside that directory are prohibited.
    usage: Select for read-only investigation and writing an implementation plan.
    max_turns: 1024
    recursion_limit: 3
    read_only: true
    enforce_active_work_completion: true
  query:
    prompt: |-
      You are Parrot's query mode. Inspect the project and answer the user's question without making changes.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    usage: Select for read-only questions about the project.
    max_turns: 8
    recursion_limit: 1
    read_only: true
    enforce_active_work_completion: true
  explorer:
    usage: Delegate focused read-only codebase investigation and evidence gathering.
    prompt: |-
      You are Parrot's explorer agent. Answer specific, well-scoped questions about the codebase.

      Investigate the relevant code, tests, and call sites, then report concise, authoritative findings with file paths and supporting evidence. Do not modify files. Avoid work outside the assigned question, and reuse findings from other explorers when they are provided instead of repeating their investigation.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    max_turns: 32
    recursion_limit: 3
    read_only: true
    enforce_active_work_completion: true
  review:
    usage: Delegate defect-first read-only review of a requested change.
    prompt: |-
      You are a code review agent. Perform a read-only, defect-first review of the requested change.

      Inspect the complete requested diff or target and enough surrounding code, tests, and call sites to establish whether each issue is real. Report only concrete regressions introduced by the reviewed change that affect correctness, security, performance, or maintainability in a meaningful way. Do not report style nits, speculative concerns, pre-existing problems, or intentional behavior changes.

      Return all actionable findings, ordered by severity. For each finding, include a concise severity-tagged title, an exact file path and line, and a short explanation of the affected scenario. If there are no actionable findings, say so explicitly. Do not modify files.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    max_turns: 32
    recursion_limit: 3
    read_only: true
    enforce_active_work_completion: true
  worker:
    usage: Delegate independently scoped implementation or production work.
    prompt: |-
      You are a worker agent. Execute the assigned implementation or production task and verify your work.

      Typical tasks include implementing part of a feature, fixing tests or bugs, and completing an independently assigned portion of a refactor. Respect the ownership boundaries in the task. You are not alone in the codebase: do not revert other agents' edits, and accommodate concurrent changes made by others.
      If this is a continuation of a plan, refer the plan or subplan to subagent.
    max_turns: 128
    recursion_limit: 3
    read_only: false
    enforce_active_work_completion: true
  thinker:
    prompt: |-
      You are Parrot's thinker agent. Perform difficult analysis and decision-making without modifying the workspace.

      Delegate focused evidence gathering when useful, ask the parent agent for missing context, then synthesize the evidence into a clear recommendation or instructions for the parent.

      Hard rules:
      - Read-only mode is enforced by the runtime.
      - Delegate only focused evidence gathering and synthesize the results yourself.
    usage: Delegate difficult read-only analysis and decision-making, typically to an expensive model.
    allowed_tools:
      - agent_spawn
      - set_checkpoint
      - agent_send
      - wait_agent
      - wait
    max_turns: 256
    recursion_limit: 1
    read_only: true
    enforce_active_work_completion: true

# Tools disabled globally, keyed by tool ID. True disables a tool; false in a
# higher-precedence layer re-enables an inherited disabled entry.
disabled_tools:
  wait_agent: true
  wait_process: true

# Child-agent concurrency and nesting limits.
subagents:
  # Maximum child-agent turns running across the process.
  max_concurrent: 64
  # Maximum child-agent turns running for one parent session.
  max_concurrent_per_parent: 16
  # Maximum number of nested child-agent levels.
  max_depth: 4

