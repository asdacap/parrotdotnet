# OpenAI-compatible providers and their model catalogs.
# providers:
#   provider:
#     # Provider adapter type: 'compatible' or 'openai-compatible'.
#     type: openai-compatible
#     # API protocol: 'responses' or 'chat-completions'.
#     protocol: responses
#     # Provider base URL, e.g. https://api.example.test/v1.
#     base_url: https://api.example.test/v1
#     # Environment variable holding the API key.
#     api_key_env: PROVIDER_API_KEY
#     # Extra headers to send. Do not store secrets here.
#     headers:
#       X-Tenant: non-secret-value
#     # Allow plain HTTP for localhost endpoints.
#     allow_insecure_localhost: false
#     # Milliseconds to wait for response headers; zero disables.
#     header_timeout_ms: 10000
#     # OpenRouter-style provider routing preferences.
#     provider_preferences:
#       order:
#         - anthropic
#       allow_fallbacks: false
#       sort: price
#     # Built-in seed catalog, normally supplied only by predefined configuration.
#     model_defaults:
#       model:
#         name: Display Name
#     # User-declared model metadata that supplements the endpoint catalog.
#     models:
#       model:
#         # Display name for the model.
#         name: Display Name
#         # Context window in tokens.
#         context: 128000
#         # Maximum output tokens.
#         max_tokens: 16384
#         # USD per input token.
#         input_price: 0.000001
#         # USD per output token.
#         output_price: 0.000002
#         # Whether the model supports tool calls.
#         tools: true
#         # Whether the model supports reasoning tokens.
#         reasoning: false
#         # Supported output modalities, e.g. text.
#         output:
#           - text
#         # Named provider request options.
#         variants:
#           high:
#             # Reasoning effort passed to the provider, e.g. low/medium/high.
#             reasoning_effort: high

# Model Context Protocol servers to start.
# mcp:
#   server-name:
#     # Transport: 'stdio' or 'http'.
#     transport: stdio
#     # Absolute path to the server executable for stdio.
#     command: /absolute/path/to/server
#     # Arguments for the server command.
#     args:
#       - --stdio
#     # Environment variables for the server process.
#     env:
#       NAME: value
#     # Working directory for the server process.
#     cwd: /absolute/working/directory
#     # Endpoint URL for http transport.
#     url: https://mcp.example.test/rpc
#     # Extra headers for http requests. Do not store secrets here.
#     headers:
#       X-Tenant: non-secret-value
#     # Whether the server is started.
#     enabled: false
#     # Allow plain HTTP for localhost endpoints.
#     allow_insecure_localhost: false
#     # Milliseconds to wait for the server to start; zero uses default.
#     startup_timeout_ms: 15000
#     # Milliseconds to wait for a call; zero uses default.
#     call_timeout_ms: 30000

# Ordered sandbox rules applied after the built-in mounts below. User rules append
# after these rules; use !replace on a sandbox_rules sequence to replace inherited
# rules, including !replace []. Each rule has a path and an action: allow_write,
# deny_read, allow_read, or deny_write. More specific paths override broader paths;
# rules for the same normalized path retain declaration order. A missing allow_write
# target is ignored unless create_if_not_exist is true, which creates it as a
# directory with any missing parents. That option is invalid for other actions.
# Paths must be absolute after environment expansion. Use ${NAME} for a required
# nonempty environment variable or ${NAME:-fallback} when it is unset or empty;
# fallbacks may contain nested expansions. Expansion does not invoke a shell and
# an unavailable required variable rejects the configuration.
#
# Built-in access (applied first):
#   /                             read-only host filesystem
#   /dev                          sandbox tmpfs
#   /dev/null                     writable null device
#   /proc                         sandbox procfs
#   {user session scratch root}   writable by every agent in that user session
#   {workspace and repository}    writable for non-read-only profiles
#   {approved profile paths}      writable for non-read-only profiles
#
sandbox_rules:
  - path: /tmp
    rule: allow_write
    create_if_not_exist: true
  - path: '${XDG_CACHE_HOME:-${HOME}/.cache}'
    rule: allow_write
    create_if_not_exist: true
  - path: '${HOME}/.nuget/packages'
    rule: allow_write
    create_if_not_exist: true
  - path: '${HOME}/.npm'
    rule: allow_write
    create_if_not_exist: true
  - path: '${HOME}/.local/share/pnpm/store'
    rule: allow_write
    create_if_not_exist: true
# Add broader rules before narrower overrides.
#   - path: /absolute/path/to/dir
#     rule: deny_read

# Web fetch restrictions.
web_fetch:
  # Allow fetching from private addresses; increases SSRF risk.
  allow_private: false
