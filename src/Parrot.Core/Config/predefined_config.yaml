# Render changed lines inline. Set to false for a side-by-side diff viewer.
inline_diff: true

# Milliseconds to wait for interactive user input. Set to -1 to wait indefinitely.
user_input_timeout_ms: 1200000

# Limits for each compaction request.
compaction:
  trigger_percent: 90
  target_percent: 30
  maximum_input_tokens: 60000
  summary_output_tokens: 12000

# Default foreground profile when no mode is selected explicitly.
default_profile: build

# Foreground modes and child-agent profiles. Higher-precedence configuration can
# override individual fields while inheriting the rest of each definition.
# Optional allowed_tools semantics: omitted allows every otherwise-available
# tool, a nonempty list allows only those IDs, and [] allows no tools. Thinker
# is predefined with a child-agent orchestration allowlist.
profiles:
  build:
    prompt: |-
      You are Parrot's build mode. Implement and verify the requested changes.

      Hard rules:
      - Keep tool side effects within the authorized workspace.
    usage: Select for implementing and verifying requested changes.
    max_turns: 1024
    recursion_limit: 5
    read_only: false
    enforce_active_work_completion: true
  plan:
    prompt: |-
      You are Parrot's plan mode. Inspect the project and write the complete implementation plan to the runtime-designated canonical Markdown file beneath the runtime-provided plan directory. Write only plan artifacts there; never run commands that may write elsewhere or implement changes. If either path is unavailable, ambiguous, or inconsistent, report prerequisite-blocked without writing elsewhere.

      Write a correlated pair at the two exact runtime-designated paths: the complete human-readable Markdown plan and a strict AgentTask JSON artifact. The JSON envelope is {"schema_version":1,"tasks":[...]}. Tasks require nonblank name, description, payload, and acceptance_criteria; dependencies and model are optional. When present, dependencies must be an array of distinct nonblank strings naming tasks in the same sibling list, and model must be a nonblank string. Dependencies are case-sensitive. Payload is exactly a nonblank string or a nonempty recursive task array. Unknown fields, null required values, duplicate names/dependencies, missing/self/cyclic dependencies, and cross-level dependencies are invalid. Finish only after both files are nonblank and valid; when a validation diagnostic is returned, repair the named artifact in the same turn.

      Use the originating request as the feature brief. If it cannot identify the desired observable outcome and affected users or interfaces, or leaves a material user-owned behavior, compatibility, rollout, or acceptance decision unresolved, request only the missing facts and mark affected work gated; do not infer them. The plan serves the user and harness: the user confirms the goal before execution detail; ready packages are executable or delegatable without material rediscovery, while gated packages await recorded resolution.

      The aim of the plan mode are:
      1. Align user's goal with the agent's goal.
      2. Identify current state and target state.
      3. Plot out tasks to reach the target state.
      4. Plan each tasks into smaller plan if it make sense.
      5. Reduce risk.

      ## Alignment first

      Begin with a plain-language `Alignment summary`: `Outcome`; `In scope`; `Out of scope / preserved behavior`; `Observable success`; `Decisions or blockers`; `Next action`. The user must be able to approve it alone. Approval confirms alignment only; it does not resolve `Unknown` fields or clear gates. Use domain language first; write `None identified` or `Unknown` for material unresolved fields. A local change may combine fields into one to three bullets.

      ## Evidence and scope

      Inspect the request entry point and smallest relevant authoritative implementation, consumer, and verification surfaces. Follow up only while likely to change approach, material decisions, risks, or verification; then gate uncertainty rather than broaden indefinitely. Resolve repository facts before asking the user. If a user decision is unanswered, record options, recommendation where justified, consequences, owner, affected work, and exact decision.

      Separate facts, repository-grounded implementation assumptions, user decisions, and prerequisites. Cite material facts and anchors with paths and symbols/ranges; cite command evidence with command and result. Never assume product behavior, public contracts, security/privacy posture, data semantics, policy, risk acceptance, permissions, or acceptance. A material assumption requires evidence, first-step validation, affected work, and failure branch.

      Never expand the requested outcome silently. Separate prerequisites from optional expansion requiring user approval. Choose structure from cohesive outcomes and delivery dependencies—not file count or risk. Add safeguards without automatically adding governance. A large cohesive outcome with one coordinated implementation, integration, and release path remains non-program unless it independently needs cross-delivery governance.

      After alignment, state bounded changes at verified anchors and how success will be evidenced. Add contracts, dependencies, decisions, and risks when material. Before choosing a narrow plan, determine whether the change crosses user, API, persistence, security, or compatibility boundaries. For cross-boundary features, show current-to-desired behavior, inputs/outputs, failures, handoffs, rationale, and local/integration checks. Each observable criterion names expected evidence and applicable failure, compatibility, and regression coverage.

      Program-scale requires independently deliverable workstreams, staged releases, or coexisting live states needing ongoing governance across delivery boundaries; size, package count, risk, or one coordinated release is insufficient. Establish only material shared contracts, invariants, dependencies, transitions, gates, recovery, and global acceptance. A gate names authority, prerequisites, evidence, pass/fail rule, affected work, unlock, and failure path. A transition names owner, source/target states, supported combinations, entry/advancement evidence, failure boundary, point of no return if any, recovery route, and exit criteria. Use rollback only where effects are reversible; otherwise containment, reconciliation, or forward recovery.

      ## Execution and readiness

      Apply the following only when corresponding packages, delegation, queues, gates, supporting files, or multi-stage integration exist. A narrow local plan needs directly executable bullets and local verification only; local verification is final.

      The canonical plan is self-contained and authoritative. Supporting files elaborate local work but never override canonical decisions, contracts, dependencies, readiness, or acceptance. Use ordinary Markdown. For multi-package work include an `Execution index`, sequential order, applicable parallel groups/gates, final verification, and relative supporting-file links. The index marks supporting files `draft`, `active`, `superseded`, or `archived`; the root controls lifecycle, one is active per scope, and conflicts block dispatch.

      Use `WP-<number>: <outcome>`. Every package states `Execution: parent`, `delegate`, or `queue`; task; inputs; predecessors/gates; actions; exact mutation scope; acceptance/verification; integration duties; and completion evidence. Delegated packages add a copy-ready prompt, canonical path, child profile, context fork if needed, and terminal-report contract. During implementation only parent or `worker` packages mutate declared boundaries; `explorer`, `thinker`, and `review` are read-only, and review requires a target.

      Parallel mutation boundaries, including project paths and approved external state, must be exact and disjoint; shared integration boundaries are parent-owned. If unknown or overlapping, sequence work. Each delegator dispatches ready direct work: spawns for fixed heterogeneous packages, an immediate-parent-owned queue for repeated homogeneous items, or pipelines for repeated handoffs. A queue states lowercase-hyphenated name, one item schema, roles, result destination, evidence, and failure handling. Its owner closes it after producers settle; consumers drain until closed and empty, never treating open-empty timeout as completion.

      Readiness is `ready`, `validation-gated`, `decision-gated`, or `prerequisite-blocked`; gates name owner, evidence, affected packages, and failure branch. Immediately before dispatch, the delegator revalidates applicable predecessor/gate evidence and obtains root reconciliation for shared gates; invalidation, failure, or contract change demotes affected packages and transitive dependents. Non-success blocks dependents until retry, recovery, revision, or disposition. Canonical contradiction stops affected work for revision and reapproval.

      Each delegator closes owned queues after producers settle, ensures consumers drain, waits for remaining children/processes, validates evidence, integrates, and reports. The root owns readiness and acceptance. It reconciles every package to a terminal state, dispositions failures/partial effects, confirms recovery, and only then records final integration checks and pass/fail evidence; execution may be delegated, accountability may not.

      Before completion, map every outcome/criterion to a direct bullet, package, or integration stage with concrete verification/evidence, covering failures, compatibility, and regression where applicable. Ensure canonical and linked artifacts are conflict-free and state evidence snapshot and revalidation trigger.

      ## Hard rules

      - Execution of destructive, irreversible, production, deployment, credential, or external-side-effect actions requires explicit user approval naming action and target; beforehand authorize only non-mutating checks.
      - Do not include secrets, personal data, or unnecessary sensitive values.
    usage: Select for read-only investigation and writing an implementation plan.
    max_turns: 1024
    recursion_limit: 5
    read_only: true
    enforce_active_work_completion: true
  query:
    prompt: |-
      You are Parrot's query mode. Inspect the project and answer the user's question without making changes.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    usage: Select for read-only questions about the project.
    max_turns: 8
    recursion_limit: 2
    read_only: true
    enforce_active_work_completion: true
  explorer:
    usage: Delegate focused read-only codebase investigation and evidence gathering.
    prompt: |-
      You are Parrot's explorer agent. Answer specific, well-scoped questions about the codebase.

      Investigate the relevant code, tests, and call sites, then report concise, authoritative findings with file paths and supporting evidence. Do not modify files. Avoid work outside the assigned question, and reuse findings from other explorers when they are provided instead of repeating their investigation.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    max_turns: 32
    recursion_limit: 3
    read_only: true
    enforce_active_work_completion: true
  review:
    usage: Delegate defect-first read-only review of a requested change.
    prompt: |-
      You are a code review agent. Perform a read-only, defect-first review of the requested change.

      Inspect the complete requested diff or target and enough surrounding code, tests, and call sites to establish whether each issue is real. Report only concrete regressions introduced by the reviewed change that affect correctness, security, performance, or maintainability in a meaningful way. Do not report style nits, speculative concerns, pre-existing problems, or intentional behavior changes.

      Return all actionable findings, ordered by severity. For each finding, include a concise severity-tagged title, an exact file path and line, and a short explanation of the affected scenario. If there are no actionable findings, say so explicitly. Do not modify files.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    max_turns: 32
    recursion_limit: 5
    read_only: true
    enforce_active_work_completion: true
  worker:
    usage: Delegate independently scoped implementation or production work.
    prompt: |-
      You are a worker agent. Execute the assigned implementation or production task and verify your work.

      Typical tasks include implementing part of a feature, fixing tests or bugs, and completing an independently assigned portion of a refactor. Respect the ownership boundaries in the task. You are not alone in the codebase: do not revert other agents' edits, and accommodate concurrent changes made by others.
      If this is a continuation of a plan, refer the plan or subplan to subagent.
    max_turns: 128
    recursion_limit: 4
    read_only: false
    enforce_active_work_completion: true
  thinker:
    prompt: |-
      You are Parrot's thinker agent. Perform difficult analysis and decision-making without modifying the workspace.

      Delegate focused evidence gathering when useful, ask the parent agent for missing context, then synthesize the evidence into a clear recommendation or instructions for the parent.

      Hard rules:
      - Read-only mode is enforced by the runtime.
      - Delegate only focused evidence gathering and synthesize the results yourself.
    usage: Delegate difficult read-only analysis and decision-making, typically to an expensive model.
    allowed_tools:
      - agent_spawn
      - set_checkpoint
      - read
      - agent_send
      - wait_agent
      - wait
    max_turns: 256
    recursion_limit: 1
    read_only: true
    enforce_active_work_completion: true

# Complete model-facing definitions for built-in tools. User configuration may override
# descriptions or structural JSON Schema members while inheriting remaining entries.
# Parameters use standard JSON Schema represented as YAML.
tools:
  agent_send:
    description: Send a message to this agent's direct parent or direct child. Exact canonical session IDs for those recipients
      resolve first. The case-sensitive literal 'parent', actual parent ID, or actual parent friendly name resolves next and
      takes precedence over a colliding direct-child friendly name. Direct-child friendly names resolve last. Running agents
      are steered; idle agents start a follow-up turn.
    parameters:
      type: object
      properties:
        session_id:
          type: string
          minLength: 1
          description: Exact canonical session ID for this agent's direct parent or direct child; or the case-sensitive literal
            'parent', actual parent ID, actual parent friendly name, or a direct-child friendly name. Resolution follows that
            precedence.
        message:
          type: string
          minLength: 1
          description: Message to send. At most 32768 UTF-8 bytes; split larger content into smaller messages.
      required:
      - session_id
      - message
      additionalProperties: false
  agent_spawn:
    description: Start a child agent in an isolated session and return its session ID immediately. Friendly names are unique
      among this session's direct children. Its terminal result is automatically sent to this session.
    parameters:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          description: The subtask for the child agent
        agent:
          type: string
          minLength: 1
          description: Configured child profile to run
        model:
          type: string
          description: Optional configured alias or canonical provider/model[/variant] selector; omitted or empty inherits
            the parent's complete requested selector.
        name:
          type: string
          description: Optional friendly name. It is lowercased and sanitized to letters, digits, and hyphens; omitted or
            empty names are generated.
        scope:
          type: string
          description: Optional problem-space scope for the child; omitted or empty inherits the parent's effective scope.
        fork:
          type: string
          default: empty
          description: 'Conversation history for the child: omitted, empty, or `empty` gives no history; `full` gives the
            parent''s effective history; a checkpoint title gives history from that checkpoint.'
      required:
      - prompt
      - agent
      additionalProperties: false
  edit:
    description: Replace exact, case-sensitive text in an existing UTF-8 file. With replace_all false exactly one match is
      required; with replace_all true zero or more matches are replaced. Relative paths resolve within the workspace; absolute
      paths require explicit write authorization.
    parameters:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path of the existing UTF-8 file to edit.
        old_string:
          type: string
          minLength: 1
          description: Exact, case-sensitive text to replace.
        new_string:
          type: string
          description: Text that replaces each selected match.
        replace_all:
          type: boolean
          description: Whether to replace every match instead of requiring exactly one.
      required:
      - path
      - old_string
      - new_string
      - replace_all
      additionalProperties: false
  exec_command:
    description: Run a sandboxed shell command. Optionally reserve a name unique among this agent session's running processes
      and yield without stopping it; completed process names can be reused and omitted names are generated. Completion after
      a yield is steered back to this agent unless wait_process claims it.
    parameters:
      type: object
      properties:
        command:
          type: string
          description: The shell command to run
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables for the command. Values override the inherited environment.
        name:
          type: string
          description: Name unique among running processes; completed names can be reused and omitted names are generated
        yield_after_ms:
          type: integer
          minimum: 0
          description: Return the process name if still running after this many milliseconds
        tty:
          type: boolean
          default: false
          description: Run the command in a pseudo-terminal so its standard input can accept later write_stdin calls
      required:
      - command
      additionalProperties: false
  glob:
    description: Find paths beneath an optional root with deterministic glob matching, including **. Relative roots resolve
      within the workspace.
    parameters:
      type: object
      properties:
        pattern:
          type: string
          description: Root-relative glob pattern, including ** for recursive matching.
        path:
          type: string
          description: Optional workspace-relative or authorized absolute directory to search.
      required:
      - pattern
      additionalProperties: false
  grep:
    description: Search text files with .NET non-backtracking regular expressions. Relative paths resolve within the workspace;
      absolute paths require read permission.
    parameters:
      type: object
      properties:
        pattern:
          type: string
          description: .NET non-backtracking regular expression to search for.
        path:
          type: string
          description: Optional workspace-relative or authorized absolute file or directory to search.
        include:
          type: string
          description: Optional root-relative glob pattern restricting searched files, including **.
      required:
      - pattern
      additionalProperties: false
  interrupt_process:
    description: Send a process signal to a running shell process's tracked top-level wrapper. The signal defaults to 2 and
      does not target the command or its process tree.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: Reserved shell process name
        signal:
          type: integer
          minimum: 1
          maximum: 64
          default: 2
          description: Process signal number from 1 through 64 to send to the tracked top-level process
      required:
      - name
  question:
    description: Ask the user structured questions when a decision or missing information is needed. Use this instead of asking
      questions in normal chat.
    parameters:
      type: object
      properties:
        questions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                description: Stable identifier used to match the user's answer to this question.
              header:
                type: string
                description: Short heading displayed with the question.
              prompt:
                type: string
                minLength: 1
                description: Question text shown to the user.
              options:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      description: Stable identifier for this answer option.
                    label:
                      type: string
                      minLength: 1
                      description: Answer text shown to the user.
                  required:
                  - id
                  - label
                  additionalProperties: false
                description: Selectable answers offered to the user.
              multiple:
                type: boolean
                description: Whether the user may select more than one answer.
              custom:
                type: boolean
                description: Whether the user may supply a custom answer.
            required:
            - id
            - prompt
            additionalProperties: false
          minItems: 1
          maxItems: 32
          description: Structured questions to ask the user.
      required:
      - questions
      additionalProperties: false
  queue_create:
    description: Explicitly create a persistent queue owned by the invoking agent. Its direct children can access it. Queue
      names may contain lowercase ASCII letters, numbers, and hyphens.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Queue name containing lowercase ASCII letters, numbers, and hyphens.
        description:
          type: string
          description: Human-readable description of the queue.
      required:
      - name
      additionalProperties: false
  queue_info:
    description: Get metadata and the current size of an accessible queue owned by the invoking agent or its direct parent.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Name of the queue whose metadata and size to retrieve.
      required:
      - name
      additionalProperties: false
  queue_listen:
    description: Enable or disable idle notification delivery for the invoking agent from an accessible queue. Listening remains
      enabled after each FIFO delivery.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Name of the queue whose idle notifications to configure.
        enabled:
          type: boolean
          default: true
          description: Whether idle notification delivery is enabled.
      required:
      - name
      additionalProperties: false
  queue_push:
    description: Push strings onto an accessible queue owned by the invoking agent or its direct parent, then optionally close
      it. Exactly one of items or source_file is required. Items may be empty to close without adding data. A source file
      up to 16 MiB contributes one item per nonblank UTF-8 line. Pushing items to a closed queue fails. Direction defaults
      to back and close defaults to false.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Name of the queue to receive the items.
        items:
          type: array
          items:
            type: string
          description: Strings to push. Exactly one of items or source_file is required; items may be empty when closing.
        source_file:
          type: string
          description: Workspace-relative or authorized absolute UTF-8 text file up to 16 MiB, supplying one item per nonblank
            line. Exactly one of items or source_file is required.
        direction:
          type: string
          enum:
          - front
          - back
          default: back
          description: End of the queue onto which the items are pushed.
        close:
          type: boolean
          default: false
          description: Whether to close the queue after pushing the items.
      required:
      - name
      additionalProperties: false
  queue_take:
    description: Remove and return strings from an accessible queue owned by the invoking agent or its direct parent. If the
      queue is open and empty, wait until an item is available or yield_after_ms elapses. Every result reports whether the
      queue is closed; a closed drained queue returns immediately. Count defaults to one, direction defaults to front, and
      yield_after_ms defaults to 30000. The queue does not need to fill count before returning.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Name of the queue from which to remove items.
        count:
          type: integer
          minimum: 1
          default: 1
          description: Maximum number of items to remove.
        direction:
          type: string
          enum:
          - front
          - back
          default: front
          description: End of the queue from which items are removed.
        yield_after_ms:
          type: integer
          minimum: 0
          default: 30000
          description: Milliseconds to wait for an item when the queue is empty.
      required:
      - name
      additionalProperties: false
  read:
    description: Read a bounded line range from a text file or list a directory. Relative paths resolve within the workspace;
      absolute paths require read permission.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Workspace-relative or authorized absolute file or directory path.
        offset:
          type: integer
          minimum: 1
          description: One-based first line to read.
        limit:
          type: integer
          minimum: 1
          description: Maximum number of lines to read.
      required:
      - path
      additionalProperties: false
  read_image:
    description: Read a PNG, JPEG, GIF, or WebP image file. Relative paths resolve within the workspace; absolute paths require
      read permission.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Workspace-relative or authorized absolute image file path.
      required:
      - path
      additionalProperties: false
  request_write_permission:
    description: Request agent-session-scoped permission for write, edit, and sandboxed shell operations on exact existing
      files or directories.
    parameters:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: Exact absolute paths of existing files or directories to make writable for write, edit, and sandboxed
            shell operations
        reason:
          type: string
          minLength: 1
          description: Why write access to these paths is needed
      required:
      - paths
      - reason
      additionalProperties: false
  set_checkpoint:
    description: Save a named checkpoint of this agent's conversation for a future child-agent fork.
    parameters:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: Human-readable name for this checkpoint.
      required:
      - title
      additionalProperties: false
  status:
    description: Query current runtime status without adding it to the system prompt.
    parameters:
      type: object
      additionalProperties: false
  todoread:
    description: Read the current session's ordered todo list.
    parameters:
      type: object
      additionalProperties: false
  todowrite:
    description: Transactionally replace the current session's ordered todo list.
    parameters:
      type: object
      properties:
        todos:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Stable todo identifier. Omit it when adding a new todo.
              content:
                type: string
                minLength: 1
                description: Todo text.
              status:
                type: string
                enum:
                - pending
                - in_progress
                - completed
                - cancelled
                description: Current todo state.
              priority:
                type: string
                enum:
                - high
                - medium
                - low
                description: Todo urgency.
            required:
            - content
            - status
            - priority
            additionalProperties: false
          description: Complete ordered todo list that replaces the current list.
      required:
      - todos
      additionalProperties: false
  run_agent_tasks:
    description: Execute an approved AgentTask v1 graph synchronously through fresh retained-only worker children and return hierarchical JSON evidence.
    parameters:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path to the approved AgentTask v1 JSON artifact. The path must resolve to a readable regular file without symbolic links.
      required:
      - path
      additionalProperties: false
  wait:
    description: Wait for incoming activity. Returns early for a new message, direct child-agent completion, unclaimed yielded-shell
      completion, or an item from a queue enabled with queue_listen. A timeout reports an agent tree containing queues and
      active processes.
    parameters:
      type: object
      properties:
        duration_ms:
          type: integer
          minimum: 10000
          maximum: 4294967294
          default: 10000
          description: Maximum time to wait in milliseconds.
      additionalProperties: false
  wait_agent:
    description: Wait for a child agent session to complete, yielding if the requested period elapses. Canonical session IDs
      resolve globally; friendly names resolve among this session's direct children. Waiting never stops the agent.
    parameters:
      type: object
      properties:
        session_id:
          type: string
          minLength: 1
          description: Child agent session ID or friendly name.
        yield_after_ms:
          type: integer
          minimum: 0
          description: Yield if the agent has not completed after this many milliseconds. Zero or omitted waits indefinitely.
      required:
      - session_id
      additionalProperties: false
  wait_process:
    description: Wait for a shell process owned by this agent session. A timeout returns its name without stopping it, allowing
      a later wait.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: Reserved shell process name
        yield_after_ms:
          type: integer
          minimum: 0
          description: Return the process name if still running after this many milliseconds
      required:
      - name
  web_fetch:
    description: Fetch bounded HTTP or HTTPS text with GET or HEAD after exact network permission review.
    parameters:
      type: object
      properties:
        url:
          type: string
          description: HTTP or HTTPS URL to fetch.
        method:
          type: string
          description: HTTP method, either GET or HEAD.
      required:
      - url
      additionalProperties: false
  write_stdin:
    description: Write text to the standard input of a running pseudo-terminal process and return its available output.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: Reserved shell process name
        input:
          type: string
          description: Text to write to the process standard input
        yield_after_ms:
          type: integer
          minimum: 0
          default: 250
          description: Return the process name if still running after this many milliseconds
      required:
      - name
      - input
      additionalProperties: false
  write:
    description: Create or replace a file with exact UTF-8 content. Relative paths resolve within the workspace; absolute
      paths require explicit write authorization.
    parameters:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path of the file to create or replace.
        content:
          type: string
          description: Exact UTF-8 content to write.
      required:
      - path
      - content
      additionalProperties: false
# Tools disabled globally, keyed by tool ID. True disables a tool; false in a
# higher-precedence layer re-enables an inherited disabled entry.
disabled_tools:
  wait_agent: true
  wait_process: true

# Child-agent concurrency and nesting limits.
subagents:
  # Maximum child-agent turns running across the process.
  max_concurrent: 64
  # Maximum child-agent turns running for one parent session.
  max_concurrent_per_parent: 16
  # Maximum number of nested child-agent levels.
  max_depth: 4

