# Predefined configuration reference.
# This file is regenerated at every startup and documents all configurable
# fields with their default values. The agent reads this file to determine
# default configuration values.

# Static system prompts keyed by namespaced system prompt provider key.
# User configuration can override an inherited key or add another entry.
# Values must be nonempty strings.
system_prompts:
  runtime:system-context:01-base: >-
    You are parrot, a coding agent. You work in the user's project directory.

    Filesystem access is determined by the active security policy and is enforced via sandboxing.


  runtime:system-context:02-delegation: >-
    # Agent delegation

    Prefer to split larger task to subagent with a well defined scope.
    However, do not split if the task is small enough, for example roughly a few tool call, as current agent can execute it manually faster.
    Minimize subagent context by regularly setting checkpoint and manually setting subagent fork point.
    When responding result to parent, prefer to use final message rather than the agent_send skill. Parent agent will be notified when child agent finished.
    Note: some model uses high reasoning and will be unresponsive for significant amount of time, do not duplicate work that it is doing.

    ## Queues

    Queue is for when there are more than 20 work item or there are multiple producer subagent.
    Do not batch or chunk items in the queue. Flatten them. Consumer can already take items in batch.
    Do not use the same queue for different roles, such as requests and results in the same queue.
    Do not give different consumer prompts for the same queue; its items should have one type.
    Do not limit a queue consumer to one item; if every agent takes only one item, spawn agents directly instead.
    An agent can only access its own queues or its parent's queue.
    Prefer queue_listen+wait over polling. A queue item can automatically start a listening idle agent's turn, although a subagent sends its parent a completion notification first.
    Producers close a queue with queue_push(close:true) when no more items will arrive; items may be empty when closing. Consumers keep taking until queue_take reports closed with no items; an open empty timeout is not completion.

    ## Agent Tasks

    Agent tasks are meant to be somewhat a horizontal or a feature concern. Composite tasks use distinct research and validation turns on one retained composite agent, which owns nested child agents; a fresh instruction leaf uses one retained payload agent that implements and verifies the instruction in one call. Do not create separate research or acceptance tasks. Each task should have a limited altitude: a program-level task should break work into feature-level tasks, and a high-level task should break work down one abstraction level, recursively. The terminal leaf should be small enough for a small llm worker to follow reliably, this mean specific requirement over open ended requirement, somewhat like the expectation of a senior vs junior engineer.

    Composite research runs once at the task altitude and can alter the effective payload if necessary. Every leaf response returns required nonblank context and exactly one of three strict verdicts: accept with nonblank evidence, reject_and_halt with nonblank feedback, or reject_and_retry with nonblank feedback and a replacement instruction string or task array. Only reject_and_retry starts a retry; its replacement context may update later attempts and descendants, otherwise the leaf response's required current context remains effective. There are user configurable maximum attempt, so reject_and_retry may halt. A final reject_and_retry retains its feedback and replacement context as the latest effective result. On total graph failure, prefer to update the graph then rerun rather than completing the tasks manually.

  runtime:system-context:03-subagent-pattern: >-
    # Common subagent spawn strategy

    Note: These are advisory

    ## Spawner

    - Agent A spawn Agent B or more agent to do indepandent work.
    - Agent A continue doing separate work.
    - Agent A uses 'wait' until Agent B send result or ask B directly if needed.
    - This is basic delegation, please clearly specify role or scope.

    ## Consultant

    - Agent A spawn Agent B or more agent that act as consultant to agent A.
      - Agent B may act like adversary or focuses on certain aspec only.
      - The subagent should have diferent role or focus than Agent A.
    - Agent A discuss with Agent B.
    - Useful for more demanding task.

    ## Council

    - Agent A starts N subagent to think about a topic. Each subagent think from different perspective.
    - For M round:
       - subagents think and send their report to Agent A.
       - Agent A compile all their reports to a scratch file, word-by-word without any alteration.
       - Agent A starts another round by sending a message to every subagent again, restarting them, but pointing at the current scratch file for more context.
    - Agent A then compile the final subagent reports and form a conclusion.
    - Use different scratch file for different round.
    - Use for very-very delicate reasoning.

    ## Work Queue

    - Agent A creates a work-item queue and spawns N equivalent agents.
    - Each subagent is instructed to keep taking work items from its direct parent's queue.
    - Agent A waits until all agents are finished.
    - This is useful for many work items and unnecessary for a small task.

    ## Pipeline graph

    - Agent A creates a graph whose edges are queues and whose nodes are groups of parallel agents.
    - For example:
      - Agent A creates three queues:
        - request queue
        - verify queue
        - result queue
      - It then creates three sets of agents:
        - request spawners create requests
        - workers take requests and push them to the verify queue, or skip directly to the result queue
        - verifiers take items from the verify queue and send them to results or back to requests for more work
      - Agent A takes from the result queue.

# Stable named prompt templates. User mappings recursively override individual
# fields. Placeholders use {name}; double braces emit literal braces.
prompt_templates:
  system.agent-identity:
    template: |-
      Child agent session: {session_id}
      Parent agent session: {parent_session_id}
      Parent agent name: {parent_session_name}
      Child agent name: {agent_name}
      Child agent depth: {depth}
    allowed_arguments: [session_id, parent_session_id, parent_session_name, agent_name, depth]
    required_arguments: [session_id, parent_session_id, parent_session_name, agent_name, depth]
  system.agent-scope:
    template: |-
      {heading}

      ### {label}
      {content}
    allowed_arguments: [heading, label, content]
    required_arguments: [heading, label, content]
  system.working-directory:
    template: 'Working directory: {working_directory}'
    allowed_arguments: [working_directory]
    required_arguments: [working_directory]
  status.selection:
    template: |-
      Active profile: {profile}
      Model: {model}{parent}
    allowed_arguments: [profile, model, parent]
    required_arguments: [profile, model, parent]
  status.selection.parent:
    template: "\nParent session: {parent}"
    allowed_arguments: [parent]
    required_arguments: [parent]
  status.generated-time:
    template: 'Generated at: {time}'
    allowed_arguments: [time]
    required_arguments: [time]
  status.runtime:
    template: 'Runtime:'
    allowed_arguments: []
    required_arguments: []
  status.runtime.agent:
    template: '{indent}- agent: {name} ({session_id})'
    allowed_arguments: [indent, name, session_id]
    required_arguments: [indent, name, session_id]
  status.runtime.queue:
    template: '{indent}  - queue: {name} ({size} items{description})'
    allowed_arguments: [indent, name, size, description]
    required_arguments: [indent, name, size, description]
  status.runtime.queue-description:
    template: ', description: {description}'
    allowed_arguments: [description]
    required_arguments: [description]
  status.runtime.process:
    template: '{indent}  - process: {id} (shell, {state}, name: {name})'
    allowed_arguments: [indent, id, state, name]
    required_arguments: [indent, id, state, name]
  agent-session.child-completion:
    template: |-
      Child agent {agent_name} completed.
      {result}
    allowed_arguments: [agent_name, result]
    required_arguments: [agent_name, result]
  agent-session.active-work-reminder:
    template: |-
      This turn must not exit while direct subagents or processes are still running.{active_work}
      Use the wait tool until no direct subagent or process remains. To interrupt a direct subagent, use agent_send to instruct it to complete. To interrupt a process, use interrupt_process. Do not finish this turn until all listed work has completed or been interrupted.
    allowed_arguments: [active_work]
    required_arguments: [active_work]
  agent-session.runaway:
    template: 'the turn exceeded its provider-request limit'
    allowed_arguments: []
    required_arguments: []
  agent-session.final-request:
    template: 'This is the final provider request allowed for the current turn. Tools are unavailable for this request. Do not request or invoke tools. Provide the best possible final answer using the information already available.'
    allowed_arguments: []
    required_arguments: []
  agent-session.tools-restored:
    template: 'A new turn has started and its provider-request budget has reset. Tool access is restored to the tools permitted for this turn.'
    allowed_arguments: []
    required_arguments: []
  agent-session.interrupted-result:
    template: 'Error: tool execution interrupted'
    allowed_arguments: []
    required_arguments: []
  agent-session.interrupted-note:
    template: '(interrupted)'
    allowed_arguments: []
    required_arguments: []
  tool-result.text:
    template: '{value}'
    allowed_arguments: [value]
    required_arguments: [value]
  tool-result.output-blob-notice:
    template: 'Full output is retained at {path}; metadata: {{literal}}.'
    allowed_arguments: [path]
    required_arguments: [path]
  tool-result.question-answer:
    template: 'Question: {question}\nAnswer: {answer}'
    allowed_arguments: [question, answer]
    required_arguments: [question, answer]
  tool-result.error:
    template: 'error: {message}'
    allowed_arguments: [message]
    required_arguments: [message]
  mode.plan-workflow:
    template: >-
      {profile_prompt} Write the canonical Markdown plan to this exact file: {plan_artifact}. Write the required AgentTask v1 JSON artifact to this exact file: {task_artifact}. The JSON must be a strict object with schema_version equal to 1 and a nonempty tasks array; each task requires nonblank name, description, payload, and acceptance_criteria. Optional dependencies must be an array of distinct nonblank, case-sensitive names in the same sibling list; an optional model must be a nonblank string. Payload is either a nonblank string or a nonempty recursive task array. You may write optional supporting artifacts under this plan directory and reference them from the canonical plan: {plan_directory}. Do not include the plan in your assistant response. Finish only after writing both canonical files.
    allowed_arguments: [profile_prompt, plan_artifact, task_artifact, plan_directory]
    required_arguments: [profile_prompt, plan_artifact, task_artifact, plan_directory]
  mode.plan-repair-read:
    template: >-
      Plan artifacts could not be read. Repair the exact Markdown path '{plan_artifact}' and task JSON path '{task_artifact}': {error}
    allowed_arguments: [plan_artifact, task_artifact, error]
    required_arguments: [plan_artifact, task_artifact, error]
  mode.plan-repair-blank-plan:
    template: >-
      The required Markdown plan artifact is blank. Write the complete plan to the exact path '{plan_artifact}', then finish again.
    allowed_arguments: [plan_artifact]
    required_arguments: [plan_artifact]
  mode.plan-repair-blank-task:
    template: >-
      The required AgentTask JSON artifact is blank. Write valid schema_version 1 task JSON to the exact path '{task_artifact}', then finish again.
    allowed_arguments: [task_artifact]
    required_arguments: [task_artifact]
  mode.plan-repair-invalid-task:
    template: >-
      The AgentTask JSON artifact at '{task_artifact}' is invalid: {error} Repair that exact file, then finish again.
    allowed_arguments: [task_artifact, error]
    required_arguments: [task_artifact, error]
  mode.plan-implementation:
    template: 'Implement the approved Markdown plan at {plan_artifact}. Call run_agent_tasks with the approved task JSON path {task_artifact}.'
    allowed_arguments: [plan_artifact, task_artifact]
    required_arguments: [plan_artifact, task_artifact]
  agent-task.role-prompts:
    template: |-
      AgentTask role: {role}
      {header}{feedback}{execution}{nested}{instruction}{declaration}{path}{response}
    allowed_arguments: [role, header, feedback, execution, nested, instruction, declaration, path, response]
    required_arguments: [role, header, feedback, execution, nested, instruction, declaration, path, response]
  agent-task.ancestor-header:
    template: '\nAncestor tasks (root to parent):'
    allowed_arguments: []
    required_arguments: []
  agent-task.context-header:
    template: '\nResearch context (root to current):'
    allowed_arguments: []
    required_arguments: []
  agent-task.dependency-header:
    template: '\nDirect dependency summaries:'
    allowed_arguments: []
    required_arguments: []
  agent-task.header:
    template: |-
      Task: {task_name}
      Description: {description}
      Acceptance criteria: {acceptance_criteria}{ancestors}{contexts}{dependencies}
    allowed_arguments: [task_name, description, acceptance_criteria, ancestors, contexts, dependencies]
    required_arguments: [task_name, description, acceptance_criteria, ancestors, contexts, dependencies]
  agent-task.feedback:
    template: |-
      Retry feedback:{items}
    allowed_arguments: [items]
    required_arguments: [items]
  agent-task.nested-results:
    template: |-
      Nested task results (structured JSON):
      {results}
    allowed_arguments: [results]
    required_arguments: [results]
  agent-task.research:
    template: |-
      AgentTask role: research pre-hook{header}
      Current task path: {path}
      Original current task declaration:
      {declaration}
      Research and prepare this task. Return only strict JSON with no prose or code fence: {response}
      Omit task_patch when no change is needed; when present omit every unchanged field.
    allowed_arguments: [header, path, declaration, response]
    required_arguments: [header, path, declaration, response]
  agent-task.execution:
    template: |-
      AgentTask role: payload executor{header}{feedback}
      Execute this instruction and return the execution result:
      {instruction}
    allowed_arguments: [header, feedback, instruction]
    required_arguments: [header, feedback, instruction]
  agent-task.leaf:
    template: |-
      AgentTask role: payload executor{header}{feedback}
      Inspect, implement, and verify this instruction:
      {instruction}
      Return only one strict JSON object with no prose or code fence: {response}
      Omit replacement_context to carry the returned current context into the next attempt.
    allowed_arguments: [header, feedback, instruction, response]
    required_arguments: [header, feedback, instruction, response]
  agent-task.acceptance:
    template: |-
      AgentTask role: acceptance reviewer{header}{feedback}
      Execution result:
      {execution}{nested}
      Assess the completed attempt. Return only one strict JSON object with no prose or code fence: {response}
      A reject_and_retry context replaces this task's research context for later attempts and descendants; omit it to retain the existing context.
    allowed_arguments: [header, feedback, execution, nested, response]
    required_arguments: [header, feedback, execution, nested, response]
  agent-task.role-failure:
    template: '{role} agent {status}: {error}'
    allowed_arguments: [role, status, error]
    required_arguments: [role, status, error]
  agent-task.truncated:
    template: |-
      {value}
      [truncated]
    allowed_arguments: [value]
    required_arguments: [value]
  compaction.summary-instructions:
    template: 'Summarise the following conversation so it can continue. Keep decisions, file paths, open tasks, and relevant evidence from images. Be terse.'
    allowed_arguments: []
    required_arguments: []
  compaction.summary-prefix:
    template: "Summary of the earlier conversation:\n"
    allowed_arguments: []
    required_arguments: []
  context.agent-scratch:
    template: 'Persistent writable scratch directory for this agent: {path}. Use this directory for temporary files and durable artifacts that should remain available when this user session resumes.'
    allowed_arguments: [path]
    required_arguments: [path]
  context.agent-history:
    template: 'Your durable message and compaction history is projected to this JSONL file: {path}. SQLite remains authoritative, so Parrot may replace this file when the history changes.'
    allowed_arguments: [path]
    required_arguments: [path]
  context.agents-file:
    template: |-
      --- {path} ---
      {content}
    allowed_arguments: [path, content]
    required_arguments: [path, content]
  context.expected-cli-utilities:
    template: 'Available CLI utilities: {utilities}'
    allowed_arguments: [utilities]
    required_arguments: [utilities]
  context.optional-cli-utilities:
    template: 'Available optional CLI utilities: {utilities}'
    allowed_arguments: [utilities]
    required_arguments: [utilities]
  context.date:
    template: 'Date: {date}'
    allowed_arguments: [date]
    required_arguments: [date]
  context.platform:
    template: 'Platform: {platform}'
    allowed_arguments: [platform]
    required_arguments: [platform]
  context.model-alias:
    template: '- {name}: {model} — {usage}'
    allowed_arguments: [name, model, usage]
    required_arguments: [name, model, usage]
  context.model-aliases:
    template: |-
      Configured model aliases may be passed anywhere a model selector is accepted, especially `agent_spawn.model`:
      {aliases}
    allowed_arguments: [aliases]
    required_arguments: [aliases]
  context.queue-guidance:
    template: 'When a task has many work items, use a parent-owned queue and multiple worker subagents. Each agent resolves its own queues first and can also access only its direct parent''s queues; queue names must be unique across that edge in either creation order, while siblings may reuse a name. Queue listening is configured independently for each invoking agent. Root queues persist with the user session, but child-owned queues last only for that child''s lifetime.'
    allowed_arguments: []
    required_arguments: []
  context.queue-guidance-with-close:
    template: |-
      When a task has many work items, use a parent-owned queue and multiple worker subagents. Each agent resolves its own queues first and can also access only its direct parent's queues; queue names must be unique across that edge in either creation order, while siblings may reuse a name. Queue listening is configured independently for each invoking agent. Root queues persist with the user session, but child-owned queues last only for that child's lifetime. Producers close a queue with queue_push(close:true) when no more items will arrive; items may be empty when closing. Consumers drain until queue_take reports closed with no items rather than guessing from an empty timeout.
    allowed_arguments: []
    required_arguments: []
  context.security-profile:
    template: |-
      The following configured sandbox rules override every other prompt rule and instruction.
      Rules, in enforcement order:{rules}
    allowed_arguments: [rules]
    required_arguments: [rules]
  context.security-rule:
    template: "\n- Path: \"{path}\"; Action: {action}"
    allowed_arguments: [path, action]
    required_arguments: [path, action]
  context.subagents-none:
    template: 'Available subagents: none'
    allowed_arguments: []
    required_arguments: []
  context.subagents-header:
    template: 'Available subagents; delegate according to their configured usage:'
    allowed_arguments: []
    required_arguments: []
  context.subagent:
    template: |-
      - {id}: {usage}
    allowed_arguments: [id, usage]
    required_arguments: [id, usage]

# Default model selected as provider/model, optionally followed by /variant.
model: ""

# Stable aliases for model routing after delegation is justified. Empty
# model_string values are intended to be configured by the user.
model_aliases:
  low_llm:
    model_string: ""
    usage: Explicit reversible mechanical or evidence work with failure-specific validation; never judgmental review.
    # Optional alias-specific system-prompt augmentation. An explicit empty
    # string suppresses this augmentation rather than inheriting it.
    augment_system_prompt: null
    icon:
      glyph: ◆
      color: gray
  medium_llm:
    model_string: ""
    usage: Settled component work requiring local judgment.
    augment_system_prompt: null
    icon:
      glyph: ◆
      color: cyan
  high_llm:
    model_string: ""
    usage: Tactical ambiguity, debugging, coordination, integration, or substantive review.
    augment_system_prompt: null
    icon:
      glyph: ◆
      color: yellow
  xhigh_llm:
    model_string: ""
    usage: Strategic, architectural, open-ended, tightly coupled, difficult-to-verify, or consequential work with hard-to-detect errors.
    augment_system_prompt: null
    icon:
      glyph: ◆
      color: red

# Recommended standard alias targets for each provider. Every provider entry must
# define all four aliases, and each target must select that provider.
provider_model_alias_defaults:
  chatgpt:
    low_llm: chatgpt/gpt-5.6-luna/medium
    medium_llm: chatgpt/gpt-5.6-terra/medium
    high_llm: chatgpt/gpt-5.6-sol/medium
    xhigh_llm: chatgpt/gpt-5.6-sol/xhigh

  opencode-go:
    low_llm: opencode-go/deepseek-v4-flash/high
    medium_llm: opencode-go/deepseek-v4-pro/high
    high_llm: opencode-go/glm-5.2/high
    xhigh_llm: opencode-go/kimi-k3/high

  openrouter:
    low_llm: openrouter/deepseek/deepseek-v4-flash-0731/high
    medium_llm: openrouter/deepseek/deepseek-v4-pro/high
    high_llm: openrouter/z-ai/glm-5.2/high
    xhigh_llm: openrouter/moonshotai/kimi-k3/high

# System-prompt augmentations keyed by exact provider/model[/variant] selector.
# Entries merge by selector. An explicit empty value clears an inherited prompt.
model_augment_system_prompts: {}

# CLI executable names to discover on PATH. Expected utilities should normally be
# available; optional utilities are reported only when installed. User entries
# append after these defaults; use !replace on either sequence to replace inherited
# entries, including !replace []. A name present in both lists is treated as expected.
cli_utilities:
  expected:
    - awk
    - bash
    - bwrap
    - curl
    - find
    - git
    - grep
    - jq
    - rg
    - sed
    - stat
    - tar
    - xargs
  optional:
    - bat
    - bun
    - cal
    - cargo
    - clang
    - cmake
    - composer
    - date
    - delta
    - deno
    - docker
    - dotnet
    - fd
    - fzf
    - gcc
    - gh
    - go
    - gradle
    - java
    - javac
    - kubectl
    - make
    - mvn
    - ninja
    - nix
    - node
    - npm
    - perl
    - php
    - pip
    - pip3
    - pnpm
    - python
    - python3
    - ruby
    - rustc
    - shellcheck
    - sleep
    - swift
    - time
    - timeout
    - touch
    - tree
    - yarn

# Command prefixes whose exec activity is rendered as compact muted output.
# User entries append after these defaults; use !replace to replace the inherited sequence.
read_only_exec_command_prefixes:
  - cat
  - file
  - find
  - git diff
  - git log
  - git show
  - git status
  - grep
  - head
  - ls
  - nl
  - pwd
  - rg
  - sed
  - stat
  - tail
  - tree
  - wc

# Render changed lines inline. Set to false for a side-by-side diff viewer.
inline_diff: true

# Number of rows retained in the live terminal buffer.
live_buffer_rows: 20

# Milliseconds to wait for interactive user input. Set to -1 to wait indefinitely.
user_input_timeout_ms: 1200000

# Limits for each compaction request.
compaction:
  trigger_percent: 95
  target_percent: 30
  maximum_input_tokens: 60000
  summary_output_tokens: 12000

# Maximum payload execution attempts for each AgentTask invocation.
agent_tasks:
  maximum_attempts: 5

# Default foreground profile when no mode is selected explicitly.
default_profile: build

# Foreground modes and child-agent profiles. Higher-precedence configuration can
# override individual fields while inheriting the rest of each definition.
# Optional allowed_tools semantics: omitted allows every otherwise-available
# tool, a nonempty list allows only those IDs, and [] allows no tools. Thinker
# is predefined with a child-agent orchestration allowlist.
profiles:
  build:
    prompt: |-
      You are Parrot's build mode. Implement and verify the requested changes.

      Hard rules:
      - Keep tool side effects within the authorized workspace.
    usage: Select for implementing and verifying requested changes.
    max_turns: 1024
    recursion_limit: 5
    read_only: false
    enforce_active_work_completion: true
    is_user_selectable: true
    is_agent_selectable: false
  plan:
    prompt: |-
      You are Parrot's plan mode. Inspect the project and write a plan to the designated canonical Markdown file beneath the provided plan directory. Write only plan artifacts there; never run commands that may write elsewhere or implement changes.

      Write a correlated pair at the two exact runtime-designated paths: the complete human-readable Markdown plan and a strict AgentTask JSON artifact. The JSON envelope is {"schema_version":1,"tasks":[...]}. Tasks require nonblank name, description, payload, and acceptance_criteria; dependencies and model are optional. When present, dependencies must be an array of distinct nonblank strings naming tasks in the same sibling list, and model must be a nonblank string. Dependencies are case-sensitive. Payload is exactly a nonblank string or a nonempty recursive task array. Unknown fields, null required values, duplicate names/dependencies, missing/self/cyclic dependencies, and cross-level dependencies are invalid. Finish only after both files are nonblank and valid; when a validation diagnostic is returned, repair the named artifact in the same turn.

      Use the originating request as the feature brief. If it cannot identify the desired observable outcome and affected users or interfaces, or leaves a material user-owned behavior, compatibility, rollout, or acceptance decision unresolved, request only the missing facts and mark affected work gated; do not infer them. The plan serves the user and harness: the user confirms the goal before execution detail; ready packages are executable or delegatable without material rediscovery, while gated packages await recorded resolution.

      The aim of the plan mode are:
      1. Clarify and present user's goal.
      2. Identify current state and target state.
      3. Plot out tasks to reach the target state.
      4. Plan each tasks into smaller plan if it make sense.
      5. Reduce risk.

      ## Alignment first

      Begin with a plain-language `Outcome`; `In scope`; `Out of scope / preserved behavior`; `Observable success`; `Next action`. The user must be able to approve it alone. Put this at the top so that the user may skim the rest of the plan. Notably, the scope or altitude of the task must match what the user expect.

      ## Current state

      Identify the current state of the repo with respect to the user's request. If the user request is to ambigious that the current project state cannot be determined properly, ask question to the user first so that the planning is relevant. Identify relevant files and document it so that implementation agent does not need to look for them again. Identify risk and blast radius and warn user if the radius is much larger than expected.

      ## Implementation

      Once the goal and current state is identified, plan the necessary step. Break up steps into milestone and tasks and for each of them identify the relevant files and acceptance criteria. Identify tasks that can be run in parallel, plan and document for it.

      ## Hard rules

      - Execution of destructive, irreversible, production, deployment, credential, or external-side-effect actions requires explicit user approval naming action and target; beforehand authorize only non-mutating checks.
      - Do not include secrets, personal data, or unnecessary sensitive values.
    usage: Select for read-only investigation and writing a plan.
    max_turns: 1024
    recursion_limit: 5
    read_only: true
    enforce_active_work_completion: true
    is_user_selectable: true
    is_agent_selectable: false
  query:
    prompt: |-
      You are Parrot's query mode. Inspect the project and answer the user's question without making changes.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    usage: Select for read-only questions about the project.
    max_turns: 8
    recursion_limit: 2
    read_only: true
    enforce_active_work_completion: true
    is_user_selectable: true
    is_agent_selectable: false
  explorer:
    usage: Delegate focused read-only codebase investigation and evidence gathering.
    prompt: |-
      You are Parrot's explorer agent. Answer specific, well-scoped questions about the codebase.

      Investigate the relevant code, tests, and call sites, then report concise, authoritative findings with file paths and supporting evidence. Do not modify files. Avoid work outside the assigned question, and reuse findings from other explorers when they are provided instead of repeating their investigation.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    max_turns: 32
    recursion_limit: 3
    read_only: true
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true
  review:
    usage: Delegate defect-first read-only review of a requested change.
    prompt: |-
      You are a code review agent. Perform a read-only, defect-first review of the requested change.

      Inspect the complete requested diff or target and enough surrounding code, tests, and call sites to establish whether each issue is real. Report only concrete regressions introduced by the reviewed change that affect correctness, security, performance, or maintainability in a meaningful way. Do not report style nits, speculative concerns, pre-existing problems, or intentional behavior changes.

      Return all actionable findings, ordered by severity. For each finding, include a concise severity-tagged title, an exact file path and line, and a short explanation of the affected scenario. If there are no actionable findings, say so explicitly. Do not modify files.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    max_turns: 32
    recursion_limit: 5
    read_only: true
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true
  worker:
    usage: Delegate independently scoped implementation or production work.
    prompt: |-
      You are a worker agent. Execute the assigned implementation or production task and verify your work.

      Typical tasks include implementing part of a feature, fixing tests or bugs, and completing an independently assigned portion of a refactor. Respect the ownership boundaries in the task. You are not alone in the codebase: do not revert other agents' edits, and accommodate concurrent changes made by others.
      If this is a continuation of a plan, refer the plan or subplan to subagent.
    max_turns: 128
    recursion_limit: 4
    read_only: false
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true
  agent-task-pre-hook:
    usage: Research and validate a composite AgentTask in one retained session.
    prompt: |-
      You are the retained composite agent for an AgentTask. Follow the current templated turn: first research and prepare the task, then later validate its nested results in this same session. You own any nested task agents created for this composite task.

      During research, inspect the task context and relevant code, resolve material implementation details, and return only the research findings and, when needed, a narrowly corrected task instruction. During validation, review the completed task against its acceptance contract and return the requested strict verdict with focused evidence. Do not implement the task or modify the workspace.
    max_turns: 128
    recursion_limit: 4
    read_only: false
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true
  agent-task-payload:
    usage: Execute an AgentTask payload and verify its observable result.
    prompt: |-
      You are an AgentTask payload executor. Implement the assigned task within its approved scope and verify the observable result against the strict contract.

      Preserve existing behavior outside the task, report concrete verification evidence, and stop when the task contract is satisfied. For instruction leaves, return only the required combined JSON with nonblank context and exactly one strict verdict.
    max_turns: 128
    recursion_limit: 4
    read_only: false
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true
  agent-task-validation:
    usage: Validate an AgentTask result against its acceptance contract.
    prompt: |-
      You are the retained composite agent's validation turn for an AgentTask. Review the completed task and its acceptance contract, then verify correctness with focused evidence. The nested task agents are children owned by this retained composite agent.

      Return exactly one strict verdict: accept, reject_and_halt, or reject_and_retry. Include nonblank evidence or actionable feedback, and do not modify the workspace.
    max_turns: 128
    recursion_limit: 4
    read_only: false
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true
  thinker:
    prompt: |-
      You are Parrot's thinker agent. Perform difficult analysis and decision-making without modifying the workspace.

      Delegate focused evidence gathering when useful, ask the parent agent for missing context, then synthesize the evidence into a clear recommendation or instructions for the parent.

      Hard rules:
      - Read-only mode is enforced by the runtime.
      - Delegate only focused evidence gathering and synthesize the results yourself.
    usage: Delegate difficult read-only analysis and decision-making, typically to an expensive model.
    allowed_tools:
      - agent_spawn
      - set_checkpoint
      - read
      - agent_send
      - wait
    max_turns: 256
    recursion_limit: 1
    read_only: true
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true

# Complete model-facing definitions for built-in tools. User configuration may override
# descriptions or structural JSON Schema members while inheriting remaining entries.
# Parameters use standard JSON Schema represented as YAML.
tools:
  agent_send:
    description: Send a message to the specified agent. Send to the direct parent or to a descendant in this sender's own
      descendant tree and user session. Descendants use relative, slash-separated friendly-name paths such as child/grandchild;
      paths only travel downward, never upward, and do not authorize arbitrary canonical IDs for descendants.
    parameters:
      type: object
      properties:
        session_id:
          type: string
          minLength: 1
          description: Exact canonical session ID for this agent's direct parent or direct child; or the case-sensitive literal
            'parent', actual parent ID, actual parent friendly name, a direct-child friendly name, or a slash-separated relative
            descendant friendly-name path such as child/grandchild. Descendant paths stay within this sender's descendant tree
            and user session, travel only downward, and do not accept canonical IDs for descendants. Resolution follows the
            direct-parent alias precedence.
        message:
          type: string
          minLength: 1
          description: Message to send. At most 32768 UTF-8 bytes; split larger content into smaller messages.
      required:
      - session_id
      - message
      additionalProperties: false
  agent_status:
    description: Report the current human-readable activity of one direct child agent without adding it to the system prompt.
    parameters:
      type: object
      properties:
        session_id:
          type: string
          minLength: 1
          description: Exact canonical session ID or friendly name of this agent's direct child.
      required:
      - session_id
      additionalProperties: false
  agent_spawn:
    description: Start a child agent in an isolated session and return its session ID immediately. Friendly names are unique
      among this session's direct children. Its terminal result is automatically sent to this session.
    parameters:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          description: The subtask for the child agent
        agent:
          type: string
          minLength: 1
          description: Configured child profile to run
        model:
          type: string
          description: Optional configured model. Default follows caller model.
        name:
          type: string
          description: Optional friendly name. It is lowercased and sanitized to letters, digits, and hyphens; omitted or
            empty names are generated.
        scope:
          type: string
          description: Optional problem-space scope for the child; omitted or empty inherits the parent's effective scope. Specify this to prevent subagent for doing redundant work with other agent.
        fork:
          type: string
          default: empty
          description: 'Conversation history for the child: default to no history; `full` gives the
            parent''s effective history; a checkpoint title gives history from that checkpoint.'
      required:
      - prompt
      - agent
      additionalProperties: false
  edit:
    description: Replace exact, case-sensitive text in an existing UTF-8 file. With replace_all false exactly one match is
      required; with replace_all true zero or more matches are replaced. Relative paths resolve within the workspace; absolute
      paths require explicit write authorization.
    parameters:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path of the existing UTF-8 file to edit.
        old_string:
          type: string
          minLength: 1
          description: Exact, case-sensitive text to replace.
        new_string:
          type: string
          description: Text that replaces each selected match.
        replace_all:
          type: boolean
          default: false
          description: Whether to replace every match instead of requiring exactly one.
      required:
      - path
      - old_string
      - new_string
      additionalProperties: false
  exec_command:
    description: Run a sandboxed shell command. Optionally reserve a name unique among this agent session's running processes
      and yield without stopping it; completed process names can be reused and omitted names are generated. A normal non-PTY
      pipe yield's authoritative typed handoff includes distinct absolute UTF-8 text stdout and stderr paths in this agent's
      scratch blob area; do not parse result text. New Parrot chunks are flushed with an approximately 100 ms normal-local-load
      visibility target, but child-process buffering is outside Parrot's control. The files remain after completion and session
      resume. PTY runs are excluded and pathless. Completed formatting and overflow notices remain compatible. All normal-pipe
      output is retained, and oversized completed output may additionally create the legacy formatted blob; quotas and garbage
      collection are not included. Completion after a yield is steered back to this agent.
    parameters:
      type: object
      properties:
        command:
          type: string
          description: The shell command to run
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables for the command. Values override the inherited environment.
        name:
          type: string
          description: Name unique among running processes; completed names can be reused and omitted names are generated
        yield_after_ms:
          type: integer
          minimum: 0
          description: Return the process name if still running after this many milliseconds
        tty:
          type: boolean
          default: false
          description: Run the command in a pseudo-terminal so its standard input can accept later write_stdin calls
      required:
      - command
      additionalProperties: false
  glob:
    description: Find paths beneath an optional root with deterministic glob matching, including **. Relative roots resolve
      within the workspace.
    parameters:
      type: object
      properties:
        pattern:
          type: string
          description: Root-relative glob pattern, including ** for recursive matching.
        path:
          type: string
          description: Optional workspace-relative or authorized absolute directory to search.
      required:
      - pattern
      additionalProperties: false
  interrupt_process:
    description: Send a process signal to a running shell process's tracked top-level wrapper. The signal defaults to 2 and
      does not target the command or its process tree.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: Reserved shell process name
        signal:
          type: integer
          minimum: 1
          maximum: 64
          default: 2
          description: Process signal number from 1 through 64 to send to the tracked top-level process
      required:
      - name
  question:
    description: Ask the user structured questions when a decision or missing information is needed. Use this instead of asking
      questions in normal chat.
    parameters:
      type: object
      properties:
        questions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                description: Stable identifier used to match the user's answer to this question.
              header:
                type: string
                description: Short heading displayed with the question.
              prompt:
                type: string
                minLength: 1
                description: Question text shown to the user.
              options:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      description: Stable identifier for this answer option.
                    label:
                      type: string
                      minLength: 1
                      description: Answer text shown to the user.
                  required:
                  - id
                  - label
                  additionalProperties: false
                description: Selectable answers offered to the user.
              multiple:
                type: boolean
                description: Whether the user may select more than one answer.
              custom:
                type: boolean
                description: Whether the user may supply a custom answer.
            required:
            - id
            - prompt
            additionalProperties: false
          minItems: 1
          maxItems: 32
          description: Structured questions to ask the user.
      required:
      - questions
      additionalProperties: false
  queue_create:
    description: Explicitly create a persistent queue owned by the invoking agent. Its direct children can access it. Queue
      names may contain lowercase ASCII letters, numbers, and hyphens.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Queue name containing lowercase ASCII letters, numbers, and hyphens.
        description:
          type: string
          description: Human-readable description of the queue.
      required:
      - name
      additionalProperties: false
  queue_info:
    description: Get metadata and the current size of an accessible queue owned by the invoking agent or its direct parent.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Name of the queue whose metadata and size to retrieve.
      required:
      - name
      additionalProperties: false
  queue_listen:
    description: Enable or disable idle notification delivery for the invoking agent from an accessible queue. Listening remains
      enabled after each FIFO delivery.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Name of the queue whose idle notifications to configure.
        enabled:
          type: boolean
          default: true
          description: Whether idle notification delivery is enabled.
      required:
      - name
      additionalProperties: false
  queue_push:
    description: Push strings onto an accessible queue owned by the invoking agent or its direct parent, then optionally close
      it. Exactly one of items or source_file is required. Items may be empty to close without adding data. A source file
      up to 16 MiB contributes one item per nonblank UTF-8 line. Pushing items to a closed queue fails. Direction defaults
      to back and close defaults to false.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Name of the queue to receive the items.
        items:
          type: array
          items:
            type: string
          description: Strings to push. Exactly one of items or source_file is required; items may be empty when closing.
        source_file:
          type: string
          description: Workspace-relative or authorized absolute UTF-8 text file up to 16 MiB, supplying one item per nonblank
            line. Exactly one of items or source_file is required.
        direction:
          type: string
          enum:
          - front
          - back
          default: back
          description: End of the queue onto which the items are pushed.
        close:
          type: boolean
          default: false
          description: Whether to close the queue after pushing the items.
      required:
      - name
      additionalProperties: false
  queue_take:
    description: Remove and return strings from an accessible queue owned by the invoking agent or its direct parent. If the
      queue is open and empty, wait until an item is available or yield_after_ms elapses. Every result reports whether the
      queue is closed; a closed drained queue returns immediately. Count defaults to one, direction defaults to front, and
      yield_after_ms defaults to 30000. The queue does not need to fill count before returning.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Name of the queue from which to remove items.
        count:
          type: integer
          minimum: 1
          default: 1
          description: Maximum number of items to remove.
        direction:
          type: string
          enum:
          - front
          - back
          default: front
          description: End of the queue from which items are removed.
        yield_after_ms:
          type: integer
          minimum: 0
          default: 30000
          description: Milliseconds to wait for an item when the queue is empty.
      required:
      - name
      additionalProperties: false
  read:
    description: Read a bounded line range from a text file or list a directory. Relative paths resolve within the workspace;
      absolute paths require read permission.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Workspace-relative or authorized absolute file or directory path.
        offset:
          type: integer
          minimum: 1
          description: One-based first line to read.
        limit:
          type: integer
          minimum: 1
          description: Maximum number of lines to read.
      required:
      - path
      additionalProperties: false
  read_image:
    description: Read a PNG, JPEG, GIF, or WebP image file. Relative paths resolve within the workspace; absolute paths require
      read permission.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Workspace-relative or authorized absolute image file path.
      required:
      - path
      additionalProperties: false
  request_write_permission:
    description: Request agent-session-scoped permission for write, edit, and sandboxed shell operations on exact existing
      files or directories.
    parameters:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: Exact absolute paths of existing files or directories to make writable for write, edit, and sandboxed
            shell operations
        reason:
          type: string
          minLength: 1
          description: Why write access to these paths is needed
      required:
      - paths
      - reason
      additionalProperties: false
  set_checkpoint:
    description: Save a named checkpoint of this agent's conversation for a future child-agent fork.
    parameters:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: Human-readable name for this checkpoint.
      required:
      - title
      additionalProperties: false
  status:
    description: Query current runtime status without adding it to the system prompt.
    parameters:
      type: object
      additionalProperties: false
  run_agent_tasks:
    description: Execute an approved AgentTask v1 graph synchronously through fresh retained-only children; instruction leaves use agent-task-payload for combined implementation and verification, while composites use distinct research and validation turns on one retained composite agent that owns nested child agents, then return hierarchical JSON evidence.
    parameters:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path to the approved AgentTask v1 JSON artifact. The path must resolve to a readable regular file without symbolic links.
        artifact:
          $ref: '#/$defs/artifact'
          description: Embedded AgentTask v1 artifact executed without reading the filesystem.
      oneOf:
      - required:
        - path
      - required:
        - artifact
      additionalProperties: false
      $defs:
        artifact:
          type: object
          description: AgentTask v1 artifact containing one or more root tasks.
          properties:
            schema_version:
              type: integer
              const: 1
              description: AgentTask artifact schema version, which must be 1.
            tasks:
              type: array
              minItems: 1
              items:
                $ref: '#/$defs/task'
              description: Root tasks in the AgentTask graph.
          required:
          - schema_version
          - tasks
          additionalProperties: false
        task:
          type: object
          description: A task in an AgentTask graph.
          properties:
            name:
              type: string
              minLength: 1
              description: Unique task name among its siblings.
            dependencies:
              type: array
              items:
                type: string
                minLength: 1
                description: Name of a sibling task this task depends on.
              uniqueItems: true
              description: Optional distinct sibling task dependencies.
            description:
              type: string
              minLength: 1
              description: Work the task must perform.
            payload:
              oneOf:
              - type: string
                minLength: 1
                description: Direct task instruction.
              - type: array
                minItems: 1
                items:
                  $ref: '#/$defs/task'
                description: Nested AgentTask graph payload.
              description: Direct instruction or nested AgentTask graph to execute.
            acceptance_criteria:
              type: string
              minLength: 1
              description: Criteria used to accept the completed task.
            model:
              type: string
              minLength: 1
              description: Optional model selector for this task.
          required:
          - name
          - description
          - payload
          - acceptance_criteria
          additionalProperties: false
  wait:
    description: Wait for incoming activity. Returns early for a new message, direct child-agent completion, unclaimed yielded-shell
      completion, or an item from a queue enabled with queue_listen. A timeout reports an agent tree containing queues and
      active processes.
    parameters:
      type: object
      properties:
        duration_ms:
          type: integer
          minimum: 10000
          maximum: 4294967294
          default: 10000
          description: Maximum time to wait in milliseconds.
      additionalProperties: false
  web_fetch:
    description: Fetch bounded HTTP or HTTPS text with GET or HEAD after exact network permission review.
    parameters:
      type: object
      properties:
        url:
          type: string
          description: HTTP or HTTPS URL to fetch.
        method:
          type: string
          description: HTTP method, either GET or HEAD.
      required:
      - url
      additionalProperties: false
  write_stdin:
    description: Write text to the standard input of a running pseudo-terminal process and return its available output.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: Reserved shell process name
        input:
          type: string
          description: Text to write to the process standard input
        yield_after_ms:
          type: integer
          minimum: 0
          default: 250
          description: Return the process name if still running after this many milliseconds
      required:
      - name
      - input
      additionalProperties: false
  write:
    description: Create or replace a file with exact UTF-8 content. Relative paths resolve within the workspace; absolute
      paths require explicit write authorization.
    parameters:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path of the file to create or replace.
        content:
          type: string
          description: Exact UTF-8 content to write.
      required:
      - path
      - content
      additionalProperties: false
# Tools disabled globally, keyed by tool ID. True disables a tool; false in a
# higher-precedence layer re-enables an inherited disabled entry.
disabled_tools: {}

# Child-agent concurrency and nesting limits.
subagents:
  # Maximum child-agent turns running across the process.
  max_concurrent: 64
  # Maximum child-agent turns running for one parent session.
  max_concurrent_per_parent: 16
  # Maximum number of nested child-agent levels.
  max_depth: 4

