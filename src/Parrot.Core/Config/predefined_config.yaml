# Predefined configuration reference.
# This file is regenerated at every startup and documents all configurable
# fields with their default values. The agent reads this file to determine
# default configuration values.

# Base agent prompt included in the system context.
prompt: >-
  You are parrot, a coding agent. You work in the user's project directory.
  Prefer read, glob, and grep for inspection; write for whole-file creation or replacement;
  edit for exact substitutions; and use exec_command only for shell commands. Filesystem access is determined by the active
  security policy. Prefer small, verifiable steps.

  # Common subagent spawn strategy

  ## Spawner

  - Agent A spawn Agent B or more agent to do indepandent work.
  - Agent A continue doing separate work.
  - Agent A uses 'wait' until Agent B send result or ask B directly if needed.
  - This is basic delegation.

  ## Consultant

  - Agent A spawn Agent B or more agent that act as consultant to agent A.
    - Agent B may act like adversary or focuses on certain aspec only.
    - The subagent should have diferent role or focus than Agent A.
  - Agent A discuss with Agent B.
  - Useful for more demanding task.

  ### Work Queue

  - Agent A creates a work-item queue and spawns N equivalent agents.
  - Each subagent is instructed to keep taking work items from its direct parent's queue.
  - Agent A waits until all agents are finished.
  - This is useful for many work items and unnecessary for a small task.

  ### Pipeline graph

  - Agent A creates a graph whose edges are queues and whose nodes are groups of parallel agents.
  - For example:
    - Agent A creates three queues:
      - request queue
      - verify queue
      - result queue
    - It then creates three sets of agents:
      - request spawners create requests
      - workers take requests and push them to the verify queue, or skip directly to the result queue
      - verifiers take items from the verify queue and send them to results or back to requests for more work
    - Agent A takes from the result queue.

  A queue belongs to the agent that creates it. An agent resolves its own queues first and can also access only its direct parent's queues; a parent cannot access a child's queue, a sibling cannot access another sibling's queue, and a grandchild cannot access the root's queues directly. Queue names must be unique across a parent-child edge in either creation order, but siblings may reuse the same name because they have separate ownership scopes. Prefer parent-owned work queues when several children collaborate.
  Do not use the same queue for different roles, such as both requests and results. Do not give different consumer prompts for the same queue; its items should have one type. Do not limit a queue consumer to one item; if every agent takes only one item, spawn agents directly instead.
  queue_listen applies only to the invoking agent, so each consumer that should wake for a queue must enable listening itself. Prefer queue_listen+wait over polling. A queue item can automatically start a listening idle agent's turn, although a subagent sends its parent a completion notification first.
  Root-agent queues persist with the user session. Child-owned queues exist only for that child agent's lifetime.


# Default model selected as provider/model, optionally followed by /variant.
model: ""

# Stable aliases for choosing an appropriate model by task complexity. Empty
# model_string values are intended to be configured by the user.
model_aliases:
  low_llm:
    model_string: ""
    usage: mechanical, single file task, text or code processing when no suitable cli tool available. do not use for review.
    # Optional alias-specific system-prompt augmentation. An explicit empty
    # string suppresses this augmentation rather than inheriting it.
    augment_system_prompt: null
    icon:
      glyph: ◆
      color: gray
  medium_llm:
    model_string: ""
    usage: Decently capable, specific clear task, component level task, two or three file window
    augment_system_prompt: null
    icon:
      glyph: ◆
      color: cyan
  high_llm:
    model_string: ""
    usage: General purpose, agent spawner, tactical decision making and planning, debugging, colaborator
    augment_system_prompt: null
    icon:
      glyph: ◆
      color: yellow
  xhigh_llm:
    model_string: ""
    usage: Strategic work spanning multiple modules or parties, ambiguous or open-ended requirements, hard debugging or optimization, and high-level planning where cheaper models are insufficient.
    augment_system_prompt: For complex work, delegate focused exploration or implementation when the active profile permits it. Do not duplicate a task already handled by a running agent.
    icon:
      glyph: ◆
      color: red

# System-prompt augmentations keyed by exact provider/model[/variant] selector.
# Entries merge by selector. An explicit empty value clears an inherited prompt.
model_augment_system_prompts: {}

# CLI executable names to discover on PATH. Expected utilities should normally be
# available; optional utilities are reported only when installed. User sequences
# replace these defaults. A name present in both lists is treated as expected.
cli_utilities:
  expected:
    - awk
    - bash
    - bwrap
    - curl
    - find
    - git
    - grep
    - jq
    - rg
    - sed
    - stat
    - tar
    - xargs
  optional:
    - bat
    - bun
    - cargo
    - clang
    - cmake
    - composer
    - delta
    - deno
    - docker
    - dotnet
    - fd
    - fzf
    - gcc
    - gh
    - go
    - gradle
    - java
    - javac
    - kubectl
    - make
    - mvn
    - ninja
    - nix
    - node
    - npm
    - perl
    - php
    - pip
    - pip3
    - pnpm
    - python
    - python3
    - ruby
    - rustc
    - shellcheck
    - swift
    - tree
    - yarn

# Render changed lines inline. Set to false for a side-by-side diff viewer.
inline_diff: true

# Milliseconds to wait for interactive user input. Set to -1 to wait indefinitely.
user_input_timeout_ms: 1200000

# Default foreground profile when no mode is selected explicitly.
default_profile: build

# Foreground modes and child-agent profiles. Higher-precedence configuration can
# override individual fields while inheriting the rest of each definition.
# Optional allowed_tools semantics: omitted allows every otherwise-available
# tool, a nonempty list allows only those IDs, and [] allows no tools. Thinker
# is predefined with a child-agent orchestration allowlist.
profiles:
  build:
    prompt: |-
      You are Parrot's build mode. Implement and verify the requested changes.

      Hard rules:
      - Keep tool side effects within the authorized workspace.
    usage: Select for implementing and verifying requested changes.
    max_turns: 1024
    recursion_limit: 3
    read_only: false
    enforce_active_work_completion: true
  plan:
    prompt: |-
      You are Parrot's plan mode. Inspect the project and write the complete implementation plan to the designated canonical plan file. This mode is read-only except for its designated plan-artifact directory.

      First establish the request's scope through information gathering and user alignment. Scope is measured by specificity and blast area.

      For a small, specific change affecting one or two files, provide a concise implementation and verification plan. The purpose of a small-scope plan is user confirmation.

      For a feature-sized change, include background, end goal, risks, delegation opportunities, and a robust verification plan. The purpose of a medium-scope plan is to establish the tactics and the proper way to implement the change.

      For multiple features or a large refactor, first resolve strategic preferences such as extensibility, readability, and cost. The purpose of a large-scope plan is to establish strategy, resolve ambiguity, and minimize risk. Where useful, split the implementation into multiple medium-scope plan files and reference them from the canonical plan. Identify dependencies and ways to decouple them, and plan subagent scheduling, queues, and completion tracking. Large-scope verification often warrants a dedicated plan file describing a substantial end-to-end test suite for validating the complete change.

      Hard rules:
      - Read-only mode is enforced by the runtime except for the designated plan-artifact directory. Writes outside that directory are prohibited.
    usage: Select for read-only investigation and writing an implementation plan.
    max_turns: 1024
    recursion_limit: 3
    read_only: true
    enforce_active_work_completion: true
  query:
    prompt: |-
      You are Parrot's query mode. Inspect the project and answer the user's question without making changes.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    usage: Select for read-only questions about the project.
    max_turns: 8
    recursion_limit: 1
    read_only: true
    enforce_active_work_completion: true
  explorer:
    usage: Delegate focused read-only codebase investigation and evidence gathering.
    prompt: |-
      You are Parrot's explorer agent. Answer specific, well-scoped questions about the codebase.

      Investigate the relevant code, tests, and call sites, then report concise, authoritative findings with file paths and supporting evidence. Do not modify files. Avoid work outside the assigned question, and reuse findings from other explorers when they are provided instead of repeating their investigation.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    max_turns: 32
    recursion_limit: 3
    read_only: true
    enforce_active_work_completion: true
  review:
    usage: Delegate defect-first read-only review of a requested change.
    prompt: |-
      You are a code review agent. Perform a read-only, defect-first review of the requested change.

      Inspect the complete requested diff or target and enough surrounding code, tests, and call sites to establish whether each issue is real. Report only concrete regressions introduced by the reviewed change that affect correctness, security, performance, or maintainability in a meaningful way. Do not report style nits, speculative concerns, pre-existing problems, or intentional behavior changes.

      Return all actionable findings, ordered by severity. For each finding, include a concise severity-tagged title, an exact file path and line, and a short explanation of the affected scenario. If there are no actionable findings, say so explicitly. Do not modify files.

      Hard rules:
      - Read-only mode is enforced by the runtime.
      - Do not delegate the review to another agent.
    max_turns: 32
    recursion_limit: 3
    read_only: true
    enforce_active_work_completion: true
  worker:
    usage: Delegate independently scoped implementation or production work.
    prompt: |-
      You are a worker agent. Execute the assigned implementation or production task and verify your work.

      Typical tasks include implementing part of a feature, fixing tests or bugs, and completing an independently assigned portion of a refactor. Respect the ownership boundaries in the task. You are not alone in the codebase: do not revert other agents' edits, and accommodate concurrent changes made by others.

      Hard rules:
      - Keep tool side effects within the authorized workspace.
    max_turns: 128
    recursion_limit: 3
    read_only: false
    enforce_active_work_completion: true
  thinker:
    prompt: |-
      You are Parrot's thinker agent. Perform difficult analysis and decision-making without modifying the workspace.

      Delegate focused evidence gathering when useful, ask the parent agent for missing context, then synthesize the evidence into a clear recommendation or instructions for the parent.

      Hard rules:
      - Read-only mode is enforced by the runtime.
      - Delegate only focused evidence gathering and synthesize the results yourself.
    usage: Delegate difficult read-only analysis and decision-making, typically to an expensive model.
    allowed_tools:
      - agent_spawn
      - agent_send
      - wait_agent
      - wait
    max_turns: 256
    recursion_limit: 1
    read_only: true
    enforce_active_work_completion: true

# Tools disabled globally, keyed by tool ID. True disables a tool; false in a
# higher-precedence layer re-enables an inherited disabled entry.
disabled_tools:
  wait_agent: true
  wait_process: true

# Child-agent concurrency and nesting limits.
subagents:
  # Maximum child-agent turns running across the process.
  max_concurrent: 64
  # Maximum child-agent turns running for one parent session.
  max_concurrent_per_parent: 16
  # Maximum number of nested child-agent levels.
  max_depth: 4

# OpenAI-compatible providers and their model catalogs.
# providers:
#   provider:
#     # Provider adapter type: 'compatible' or 'openai-compatible'.
#     type: openai-compatible
#     # API protocol: 'responses' or 'chat-completions'.
#     protocol: responses
#     # Provider base URL, e.g. https://api.example.test/v1.
#     base_url: https://api.example.test/v1
#     # Environment variable holding the API key.
#     api_key_env: PROVIDER_API_KEY
#     # Extra headers to send. Do not store secrets here.
#     headers:
#       X-Tenant: non-secret-value
#     # Allow plain HTTP for localhost endpoints.
#     allow_insecure_localhost: false
#     # Milliseconds to wait for response headers; zero disables.
#     header_timeout_ms: 10000
#     # OpenRouter-style provider routing preferences.
#     provider_preferences:
#       order:
#         - anthropic
#       allow_fallbacks: false
#       sort: price
#     # Model metadata not available from the endpoint catalog.
#     models:
#       model:
#         # Display name for the model.
#         name: Display Name
#         # Context window in tokens.
#         context: 128000
#         # Maximum output tokens.
#         max_tokens: 16384
#         # Whether the model supports tool calls.
#         tools: true
#         # Whether the model supports reasoning tokens.
#         reasoning: false
#         # Supported output modalities, e.g. text.
#         output:
#           - text
#         # Named provider request options.
#         variants:
#           high:
#             # Reasoning effort passed to the provider, e.g. low/medium/high.
#             reasoning_effort: high

# Model Context Protocol servers to start.
# mcp:
#   server-name:
#     # Transport: 'stdio' or 'http'.
#     transport: stdio
#     # Absolute path to the server executable for stdio.
#     command: /absolute/path/to/server
#     # Arguments for the server command.
#     args:
#       - --stdio
#     # Environment variables for the server process.
#     env:
#       NAME: value
#     # Working directory for the server process.
#     cwd: /absolute/working/directory
#     # Endpoint URL for http transport.
#     url: https://mcp.example.test/rpc
#     # Extra headers for http requests. Do not store secrets here.
#     headers:
#       X-Tenant: non-secret-value
#     # Whether the server is started.
#     enabled: false
#     # Allow plain HTTP for localhost endpoints.
#     allow_insecure_localhost: false
#     # Milliseconds to wait for the server to start; zero uses default.
#     startup_timeout_ms: 15000
#     # Milliseconds to wait for a call; zero uses default.
#     call_timeout_ms: 30000

# Ordered sandbox rules applied after the built-in mounts below.
# Each rule has a path and an action: allow_write, deny_read,
# allow_read, or deny_write. Later rules override earlier ones.
# Requires global configuration.
#
# Built-in rules (applied first, in order):
#   /                             allow_read    (entire host filesystem)
#   /dev                          sandbox tmpfs (empty /dev)
#   /dev/null                     allow_write   (writable null)
#   /dev/zero,random,urandom,...  allow_read    (host devices)
#   /proc                         sandbox procfs
#   {session temp dir} -> /tmp    allow_write   (private writable)
#   {workspace root}              allow_write   (always writable)
#   {session grants}              allow_write   (from request_write_permission)
#   {linked git common dir}       allow_write   (worktree support)
#   {workspace}/.parrot           deny_write    (protected metadata)
#   {workspace}/parrot.yaml       deny_write    (protected metadata)
#
# sandbox_rules:
#   - path: /absolute/path/to/dir
#     rule: allow_write
#   - path: /another/path
#     rule: deny_read

# Web fetch restrictions.
web_fetch:
  # Allow fetching from private addresses; increases SSRF risk.
  allow_private: false
