    high_llm: openrouter/z-ai/glm-5.2/high
    xhigh_llm: openrouter/moonshotai/kimi-k3/high

# System-prompt augmentations keyed by exact provider/model[/variant] selector.
# Entries merge by selector. An explicit empty value clears an inherited prompt.
model_augment_system_prompts: {}

# CLI executable names to discover on PATH. Expected utilities should normally be
# available; optional utilities are reported only when installed. User entries
# append after these defaults; use !replace on either sequence to replace inherited
# entries, including !replace []. A name present in both lists is treated as expected.
cli_utilities:
  expected:
    - awk
    - bash
    - bwrap
    - curl
    - find
    - git
    - grep
    - jq
    - rg
    - sed
    - stat
    - tar
    - xargs
  optional:
    - bat
    - bun
    - cal
    - cargo
    - clang
    - cmake
    - composer
    - date
    - delta
    - deno
    - docker
    - dotnet
    - fd
    - fzf
    - gcc
    - gh
    - go
    - gradle
    - java
    - javac
    - kubectl
    - make
    - mvn
    - ninja
    - nix
    - node
    - npm
    - perl
    - php
    - pip
    - pip3
    - pnpm
    - python
    - python3
    - ruby
    - rustc
    - shellcheck
    - sleep
    - swift
    - time
    - timeout
    - touch
    - tree
    - yarn

# Command prefixes whose exec activity is rendered as compact muted output.
# User entries append after these defaults; use !replace to replace the inherited sequence.
read_only_exec_command_prefixes:
  - cat
  - file
  - find
  - git diff
  - git log
  - git show
  - git status
  - grep
  - head
  - ls
  - nl
  - pwd
  - rg
  - sed
  - stat
  - strings
  - tail
  - tree
  - wc

# Render changed lines inline. Set to false for a side-by-side diff viewer.
inline_diff: true

# Number of rows retained in the live terminal buffer.
live_buffer_rows: 20

# Milliseconds to wait for interactive user input. Set to -1 to wait indefinitely.
user_input_timeout_ms: 1200000

# Limits for each compaction request.
compaction:
  trigger_percent: 95
  target_percent: 30
  maximum_input_tokens: 60000
  summary_output_tokens: 12000

# Maximum payload execution attempts for each AgentTask invocation.
agent_tasks:
  maximum_attempts: 5
  # Fork the owning parent's conversation history into fresh AgentTask children.
  fork_parent_history: true

# Default foreground profile when no mode is selected explicitly.
default_profile: build

# Foreground modes and child-agent profiles. Higher-precedence configuration can
# override individual fields while inheriting the rest of each definition.
# Optional allowed_tools semantics: omitted allows every otherwise-available
# tool, a nonempty list allows only those IDs, and [] allows no tools. Thinker
# is predefined with a child-agent orchestration allowlist.
profiles:
  build:
    prompt: |-
      You are Parrot's build mode. Implement and verify the requested changes.

      Hard rules:
      - Keep tool side effects within the authorized workspace.
    usage: Select for implementing and verifying requested changes.
    max_turns: 1024
    recursion_limit: 5
    read_only: false
    enforce_active_work_completion: true
    is_user_selectable: true
    is_agent_selectable: false
  plan:
    prompt: |-
      You are Parrot's plan mode. Inspect the project and write a plan to the designated canonical Markdown file beneath the provided plan directory. Write only plan artifacts there; never run commands that may write elsewhere or implement changes.

      Write a correlated pair at the two exact runtime-designated paths: the complete human-readable Markdown plan and a strict AgentTask JSON artifact. The JSON envelope is {"schema_version":1,"tasks":[...]}; its top-level tasks array must be nonempty. Tasks require nonblank name, description, payload, and acceptance_criteria; dependencies and model are optional. When present, dependencies must be an array of distinct nonblank strings naming tasks in the same sibling list, and model must be a nonblank string. Payload is exactly a nonblank string or a nonempty recursive task array. Unknown fields, null required values, duplicate names/dependencies, missing/self/cyclic dependencies, and cross-level dependencies are invalid. Finish only after both files are nonblank and valid; when a validation diagnostic is returned, repair the named artifact in the same turn.

      Use the originating request as the feature brief. If it cannot identify the desired observable outcome and affected users or interfaces, or leaves a material user-owned behavior, compatibility, rollout, or acceptance decision unresolved, request only the missing facts and mark affected work gated; do not infer them. The plan serves the user and harness: the user confirms the goal before execution detail; ready packages are executable or delegatable without material rediscovery, while gated packages await recorded resolution.

      The aim of the plan mode are:
      1. Clarify and present user's goal.
      2. Identify current state and target state.
      3. Plot out tasks to reach the target state.
      4. Plan each tasks into smaller plan if it make sense.
      5. Reduce risk.

      ## Alignment first

      Begin with a plain-language `Outcome`; `In scope`; `Out of scope / preserved behavior`; `Observable success`; `Next action`. The user must be able to approve it alone. Put this at the top so that the user may skim the rest of the plan. Notably, the scope or altitude of the task must match what the user expect. It is also useful to state the background, the WHY for this task which tend to help alignment with the user.

      ## Current state

      Identify the current state of the repo with respect to the user's request. If the user request is to ambigious that the current project state cannot be determined properly, ask question to the user first so that the planning is relevant. Identify relevant files and document it so that implementation agent does not need to look for them again. Identify risk and blast radius and warn user if the radius is much larger than expected.

      ## Implementation

      Once the goal and current state is identified, plan the necessary step. Break up steps into milestone and tasks and for each of them identify the relevant files and acceptance criteria. Identify tasks that can be run in parallel, plan and document for it.

      ## Hard rules

      - Execution of destructive, irreversible, production, deployment, credential, or external-side-effect actions requires explicit user approval naming action and target; beforehand authorize only non-mutating checks.
      - Do not include secrets, personal data, or unnecessary sensitive values.
    usage: Select for read-only investigation and writing a plan.
    max_turns: 1024
    recursion_limit: 5
    read_only: true
    enforce_active_work_completion: true
    is_user_selectable: true
    is_agent_selectable: false
  query:
    prompt: |-
      You are Parrot's query mode. Inspect the project and answer the user's question without making changes.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    usage: Select for read-only questions about the project.
    max_turns: 8
    recursion_limit: 2
    read_only: true
    enforce_active_work_completion: true
    is_user_selectable: true
    is_agent_selectable: false
  explorer:
    usage: Delegate focused read-only codebase investigation and evidence gathering.
    prompt: |-
      You are Parrot's explorer agent. Answer specific, well-scoped questions about the codebase.

      Investigate the relevant code, tests, and call sites, then report concise, authoritative findings with file paths and supporting evidence. Do not modify files. Avoid work outside the assigned question, and reuse findings from other explorers when they are provided instead of repeating their investigation.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    max_turns: 32
    recursion_limit: 3
    read_only: true
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true
  review:
    usage: Delegate defect-first read-only review of a requested change.
    prompt: |-
      You are a code review agent. Perform a read-only, defect-first review of the requested change.

      Inspect the complete requested diff or target and enough surrounding code, tests, and call sites to establish whether each issue is real. Report only concrete regressions introduced by the reviewed change that affect correctness, security, performance, or maintainability in a meaningful way. Do not report style nits, speculative concerns, pre-existing problems, or intentional behavior changes.

      Return all actionable findings, ordered by severity. For each finding, include a concise severity-tagged title, an exact file path and line, and a short explanation of the affected scenario. If there are no actionable findings, say so explicitly. Do not modify files.

      Hard rules:
      - Read-only mode is enforced by the runtime.
    max_turns: 32
    recursion_limit: 5
    read_only: true
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true
  worker:
    usage: Delegate independently scoped implementation or production work.
    prompt: |-
      You are a worker agent. Execute the assigned implementation or production task and verify your work.

      Typical tasks include implementing part of a feature, fixing tests or bugs, and completing an independently assigned portion of a refactor. Respect the ownership boundaries in the task. You are not alone in the codebase: do not revert other agents' edits, and accommodate concurrent changes made by others.
      If this is a continuation of a plan, refer the plan or subplan to subagent.
    max_turns: 128
    recursion_limit: 4
    read_only: false
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true
  agent-task-prepare:
    usage: Prepare and validate a composite AgentTask in one retained session.
    prompt: |-
      You are the retained composite agent for an AgentTask. Follow the current templated turn: first prepare the task, then later validate its nested results in this same session. You own any nested task agents created for this composite task.

      During preparation, build useful context from the task and relevant code, and optionally apply a narrow run-local correction to the effective task or inner graph. Return only the preparation context and, when needed, the narrowly corrected task instruction. During validation, review the completed task against its acceptance contract and return the requested strict verdict with focused evidence. Do not implement the task or modify the workspace.
    max_turns: 128
    recursion_limit: 4
    read_only: false
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true
  agent-task-payload:
    usage: Execute an AgentTask payload and verify its observable result.
    prompt: |-
      You are an AgentTask payload executor. Implement the assigned task within its approved scope and verify the observable result against the strict contract.

      Preserve existing behavior outside the task, report concrete verification evidence, and stop when the task contract is satisfied. For instruction leaves, return only the required strict JSON with nonblank result and exactly one strict verdict. Composite preparation context and validation evidence remain separate.
    max_turns: 128
    recursion_limit: 4
    read_only: false
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true
  agent-task-validation:
    usage: Validate an AgentTask result against its acceptance contract.
    prompt: |-
      You are the retained composite agent's validation turn for an AgentTask. Review the completed task and its acceptance contract, then verify correctness with focused evidence. The nested task agents are children owned by this retained composite agent.

      Return exactly one strict verdict: accept, reject_and_halt, or reject_and_retry. Include nonblank evidence or actionable feedback, and do not modify the workspace.
    max_turns: 128
    recursion_limit: 4
    read_only: false
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true
  thinker:
    prompt: |-
      You are Parrot's thinker agent. Perform difficult analysis and decision-making without modifying the workspace.

      Delegate focused evidence gathering when useful, ask the parent agent for missing context, then synthesize the evidence into a clear recommendation or instructions for the parent.

      Hard rules:
      - Read-only mode is enforced by the runtime.
      - Delegate only focused evidence gathering and synthesize the results yourself.
    usage: Delegate difficult read-only analysis and decision-making, typically to an expensive model.
    allowed_tools:
      - agent_spawn
      - set_checkpoint
      - read
      - agent_send
      - question
      - answer
      - wait
    max_turns: 256
    recursion_limit: 1
    read_only: true
    enforce_active_work_completion: true
    is_user_selectable: false
    is_agent_selectable: true

# Complete model-facing definitions for built-in tools. User configuration may override
# descriptions or structural JSON Schema members while inheriting remaining entries.
# Parameters use standard JSON Schema represented as YAML.
tools:
  compact_context:
    description: Compact only this calling agent session's context without affecting its parent or children, then report the post-operation context status.
    parameters:
      type: object
      additionalProperties: false
  answer:
    description: Answer the pending ordered questions from one direct child agent.
    parameters:
      type: object
      properties:
        agent_session_id:
          type: string
          minLength: 1
          description: Exact canonical session ID of the direct child whose pending question is being answered.
        answers:
          type: array
          minItems: 1
          maxItems: 32
          description: One nonblank textual answer for every question, in the order shown in the child question steer.
          items:
            type: string
            minLength: 1
      required:
      - agent_session_id
      - answers
      additionalProperties: false
  agent_send:
    description: Send a message to the specified agent. Send to the direct parent or direct child or to a descendant in this sender's own
      descendant tree. Descendants use relative, slash-separated friendly-name paths such as child/grandchild;
      paths only travel downward.
    parameters:
      type: object
      properties:
        session_id:
          type: string
          minLength: 1
          description: Exact canonical session ID for this agent's direct parent or direct child; or the case-sensitive literal
            'parent', actual parent ID, actual parent friendly name, a direct-child friendly name, or a slash-separated relative
            descendant friendly-name path such as child/grandchild. Descendant paths stay within this sender's descendant tree
            and user session, travel only downward, and do not accept canonical IDs for descendants. Resolution follows the
            direct-parent alias precedence.
        message:
          type: string
          minLength: 1
          description: Message to send. At most 32768 UTF-8 bytes; split larger content into smaller messages.
      required:
      - session_id
      - message
      additionalProperties: false
  agent_status:
    description: Report the current activity of one direct child agent.
    parameters:
      type: object
      properties:
        session_id:
          type: string
          minLength: 1
          description: Exact canonical session ID or friendly name of this agent's direct child.
      required:
      - session_id
      additionalProperties: false
  agent_spawn:
    description: Start a child agent in an isolated session and return its session ID immediately. Friendly names are unique
      among this session's direct children. Its terminal result is automatically sent to this session.
    parameters:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          description: The subtask for the child agent
        agent:
          type: string
          minLength: 1
          description: Configured child profile to run
        model:
          type: string
          description: Optional configured model. Default follows caller model.
        name:
          type: string
          description: Optional friendly name. It is lowercased and sanitized to letters, digits, and hyphens; omitted or
            empty names are generated.
        scope:
          type: string
          description: Optional problem-space scope for the child; omitted or empty inherits the parent's effective scope. Specify this to prevent subagent for doing redundant work with other agent.
        fork:
          type: string
          default: empty
          description: 'Conversation history for the child: default to no history; `full` gives the
            parent''s effective history; a checkpoint title gives history from that checkpoint.'
      required:
      - prompt
      - agent
      additionalProperties: false
  edit:
    description: Replace exact, case-sensitive text in an existing UTF-8 file. With replace_all false exactly one match is
      required; with replace_all true zero or more matches are replaced. Relative paths resolve within the workspace; absolute
      paths require explicit write authorization.
    parameters:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path of the existing UTF-8 file to edit.
        old_string:
          type: string
          minLength: 1
          description: Exact, case-sensitive text to replace.
        new_string:
          type: string
          description: Text that replaces each selected match.
        replace_all:
          type: boolean
          default: false
          description: Whether to replace every match instead of requiring exactly one.
      required:
      - path
      - old_string
      - new_string
      additionalProperties: false
  exec_command:
    description: Run a shell command. Command run sandbox by default. Optionally reserve a name unique among this agent session's running processes
      and yield without stopping it; completed process names can be reused and omitted names are generated.
      Yielded run will send notification to caller once done. Additionally, a non-PTY pipe yield's includes text stdout and stderr paths
      in this agent's scratch blob area for live parsing if needed. The files remain after completion.
    parameters:
      type: object
      properties:
        command:
          type: string
          description: The shell command to run
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables for the command. Values override the inherited environment.
        name:
          type: string
          description: Name unique among running processes; completed names can be reused and omitted names are generated
        yield_after_ms:
          type: integer
          minimum: 500
          description: Return the process name if still running after this many milliseconds. 0 mean yield immediately. undefined means block indefinitely.
        tty:
          type: boolean
          default: false
          description: Run the command in a pseudo-terminal so its standard input can accept later write_stdin calls
      required:
      - command
      additionalProperties: false
  glob:
    description: Find paths beneath an optional root with deterministic glob matching, including **. Relative roots resolve
      within the workspace.
    parameters:
      type: object
      properties:
        pattern:
          type: string
          description: Root-relative glob pattern, including ** for recursive matching.
        path:
          type: string
          description: Optional workspace-relative or authorized absolute directory to search.
      required:
      - pattern
      additionalProperties: false
  interrupt_process:
    description: Send a process signal to a running shell process's tracked top-level wrapper. The signal defaults to 2 and
      does not target the command or its process tree.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: Reserved shell process name
        signal:
          type: integer
          minimum: 1
          maximum: 64
          default: 2
          description: Process signal number from 1 through 64 to send to the tracked top-level process
      required:
      - name
  question:
    description: Ask ordered questions when a decision or missing information is needed. The root agent asks the user; a child agent asks its direct parent. Use this instead of asking questions in normal chat.
    parameters:
      type: object
      properties:
        questions:
          type: array
          items:
            type: object
            properties:
              header:
                type: string
                description: Short heading displayed with the question.
              prompt:
                type: string
                minLength: 1
                description: Question text shown to the user.
              options:
                type: array
                items:
                  type: string
                  minLength: 1
                description: Plain-text selectable answers offered to the user.
              multiple:
                type: boolean
                description: Whether the user may select more than one answer.
              custom:
                type: boolean
                description: Whether the user may supply a custom answer.
            required:
            - prompt
            additionalProperties: false
          minItems: 1
          maxItems: 32
          description: Questions whose answers are returned in the same order.
      required:
      - questions
      additionalProperties: false
  queue_create:
    description: Explicitly create a persistent queue owned by the invoking agent. Its direct children can access it. Queue
      names may contain lowercase ASCII letters, numbers, and hyphens.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Queue name containing lowercase ASCII letters, numbers, and hyphens.
        description:
          type: string
          description: Human-readable description of the queue.
      required:
      - name
      additionalProperties: false
  queue_info:
    description: Get metadata and the current size of an accessible queue owned by the invoking agent or its direct parent.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Name of the queue whose metadata and size to retrieve.
      required:
      - name
      additionalProperties: false
  queue_listen:
    description: Enable or disable idle notification delivery for the invoking agent from an accessible queue. Listening remains
      enabled after each FIFO delivery.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Name of the queue whose idle notifications to configure.
        enabled:
          type: boolean
          default: true
          description: Whether idle notification delivery is enabled.
      required:
      - name
      additionalProperties: false
  queue_push:
    description: Push strings onto an accessible queue owned by the invoking agent or its direct parent, then optionally close
      it. Exactly one of items or source_file is required. Items may be empty to close without adding data. A source file
      up to 16 MiB contributes one item per nonblank UTF-8 line. Pushing items to a closed queue fails. Direction defaults
      to back and close defaults to false.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Name of the queue to receive the items.
        items:
          type: array
          items:
            type: string
          description: Strings to push. Exactly one of items or source_file is required; items may be empty when closing.
        source_file:
          type: string
          description: Workspace-relative or authorized absolute UTF-8 text file up to 16 MiB, supplying one item per nonblank
            line. Exactly one of items or source_file is required.
        direction:
          type: string
          enum:
          - front
          - back
          default: back
          description: End of the queue onto which the items are pushed.
        close:
          type: boolean
          default: false
          description: Whether to close the queue after pushing the items.
      required:
      - name
      additionalProperties: false
  queue_take:
    description: Remove and return strings from an accessible queue owned by the invoking agent or its direct parent. If the
      queue is open and empty, wait until an item is available or yield_after_ms elapses. Every result reports whether the
      queue is closed; a closed drained queue returns immediately. Count defaults to one, direction defaults to front, and
      yield_after_ms defaults to 30000. The queue does not need to fill count before returning.
    parameters:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Name of the queue from which to remove items.
        count:
          type: integer
          minimum: 1
          default: 1
          description: Maximum number of items to remove.
        direction:
          type: string
          enum:
          - front
          - back
          default: front
          description: End of the queue from which items are removed.
        yield_after_ms:
          type: integer
          minimum: 0
          default: 30000
          description: Milliseconds to wait for an item when the queue is empty.
      required:
      - name
      additionalProperties: false
  read:
    description: Read a bounded line range from a text file or list a directory. Relative paths resolve within the workspace;
      absolute paths require read permission.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Workspace-relative or authorized absolute file or directory path.
        offset:
          type: integer
          minimum: 1
          description: One-based first line to read.
        limit:
          type: integer
          minimum: 1
          description: Maximum number of lines to read.
      required:
      - path
      additionalProperties: false
  imagegen:
    description: >-
      Generate or edit one PNG image using gpt-image-2 through the current turn's provider and credentials.
      Requires a prompt and output_path ending in .png. Saves the image and returns its absolute path, without attaching
      or displaying it. Existing regular files may be overwritten under the active write-security profile.
      Relative paths resolve within the workspace; absolute paths require permission. Missing authorized parents are created.
      Omit referenced_image_paths to generate; provide up to five local PNG, JPEG, or WebP files to edit, in reference order.
      Inspect unfamiliar local images with read_image first. References must be single-frame images, at most 10 MiB each
      and 50 MiB total, at most 8192 pixels per dimension and 40000000 pixels. Output is limited to 32 MiB with the same
      dimension and frame limits. Generation may take several minutes, with a ten-minute operation timeout.
      ChatGPT uses existing OAuth login; OpenAI-compatible providers use their configured credentials and Images endpoints
      and may charge for generation. Unsupported providers or endpoints fail without fallback. No URL, conversation-history,
      mask, or batch input is supported. Request each asset separately; transparency is not guaranteed.
    parameters:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          description: Image generation or editing instructions, sent verbatim to the image model.
        output_path:
          type: string
          minLength: 1
          description: Workspace-relative or authorized absolute .png destination; existing regular files may be overwritten.
        referenced_image_paths:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
          description: Ordered local image paths to edit or use as references. Omit or leave empty to generate without references.
      required:
      - prompt
      - output_path
      additionalProperties: false
  read_image:
    description: Read a PNG, JPEG, GIF, or WebP image file. Relative paths resolve within the workspace; absolute paths require
      read permission.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Workspace-relative or authorized absolute image file path.
      required:
      - path
      additionalProperties: false
  request_write_permission:
    description: Request agent-session-scoped permission for write, edit, and sandboxed shell operations on exact existing
      files or directories.
    parameters:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: Exact absolute paths of existing files or directories to make writable for write, edit, and sandboxed
            shell operations
        reason:
          type: string
          minLength: 1
          description: Why write access to these paths is needed
      required:
      - paths
      - reason
      additionalProperties: false
  set_checkpoint:
    description: Save a named checkpoint of this agent's conversation for a future child-agent fork.
    parameters:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: Human-readable name for this checkpoint.
      required:
      - title
      additionalProperties: false
  set_exit_reminder:
    description: Set or clear the reminder injected before this agent finishes a turn.
    parameters:
      type: object
      properties:
        reminder:
          type: string
          nullable: true
          description: Reminder text; omit, use null, or use an empty string to clear the reminder.
      additionalProperties: false
  status:
    description: Query current runtime status without adding it to the system prompt.
    parameters:
      type: object
      additionalProperties: false
  run_agent_tasks:
    description: Start an approved AgentTask v1 artifact with a nonempty list of top-level sibling tasks in the background, reusing same-name direct child agents with their existing settings and history or creating retained-only children when absent; agents remain available after graph completion, and SendAndWaitForResult waits for prior work before each task turn. New instruction leaf agents use agent-task-payload for implementation and verification with strict result JSON, while composites use distinct preparation and validation turns on one retained composite agent that owns nested child agents, then deliver hierarchical JSON evidence automatically on completion.
    parameters:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path to the approved AgentTask v1 JSON artifact. The path must resolve to a readable regular file without symbolic links.
        artifact:
          $ref: '#/$defs/artifact'
          description: Embedded AgentTask v1 artifact executed without reading the filesystem.
      oneOf:
      - required:
        - path
      - required:
        - artifact
      additionalProperties: false
      $defs:
        artifact:
          type: object
          description: AgentTask v1 artifact containing one or more top-level sibling tasks.
          properties:
            schema_version:
              type: integer
              const: 1
              description: AgentTask artifact schema version, which must be 1.
            tasks:
              type: array
              minItems: 1
              items:
                $ref: '#/$defs/task'
              description: Nonempty top-level sibling tasks in the AgentTask graph.
          required:
          - schema_version
          - tasks
          additionalProperties: false
        task:
          type: object
          description: A task in an AgentTask graph.
          properties:
            name:
              type: string
              minLength: 1
              description: Unique task name among its siblings.
            dependencies:
              type: array
              items:
                type: string
                minLength: 1
                description: Name of a sibling task this task depends on.
              uniqueItems: true
              description: Optional distinct sibling task dependencies.
            description:
              type: string
              minLength: 1
              description: Work the task must perform.
            payload:
              oneOf:
              - type: string
                minLength: 1
                description: Direct task instruction.
              - type: array
                minItems: 1
                items:
                  $ref: '#/$defs/task'
                description: Nested AgentTask graph payload.
              description: Direct instruction or nested AgentTask graph to execute.
            acceptance_criteria:
              type: string
              minLength: 1
              description: Criteria used to accept the completed task.
            model:
              type: string
              minLength: 1
              description: Optional model selector for this task.
          required:
          - name
          - description
          - payload
          - acceptance_criteria
          additionalProperties: false
  wait:
    description: Wait for incoming activity. Returns early for a new message, direct child-agent completion, AgentTask graph completion, unclaimed yielded-shell completion, or an item from a queue enabled with queue_listen. A timeout reports an agent tree containing queues and active processes. Use this rather than `sleep` cli.
    parameters:
      type: object
      properties:
        duration_ms:
          type: integer
          minimum: 10000
          maximum: 4294967294
          default: 10000
          description: Maximum time to wait in milliseconds.
      additionalProperties: false
  web_fetch:
    description: Fetch bounded HTTP or HTTPS text with GET or HEAD after exact network permission review.
    parameters:
      type: object
      properties:
        url:
          type: string
          description: HTTP or HTTPS URL to fetch.
        method:
          type: string
          description: HTTP method, either GET or HEAD.
      required:
      - url
      additionalProperties: false
  write_stdin:
    description: Write text to the standard input of a running pseudo-terminal process and return its available output.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: Reserved shell process name
        input:
          type: string
          description: Text to write to the process standard input
        yield_after_ms:
          type: integer
          minimum: 0
          default: 250
          description: Return the process name if still running after this many milliseconds
      required:
      - name
      - input
      additionalProperties: false
  write:
    description: Create or replace a file with exact UTF-8 content. Relative paths resolve within the workspace; absolute
      paths require explicit write authorization.
    parameters:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path of the file to create or replace.
        content:
          type: string
          description: Exact UTF-8 content to write.
      required:
      - path
      - content
      additionalProperties: false
# Tools disabled globally, keyed by tool ID. True disables a tool; false in a
# higher-precedence layer re-enables an inherited disabled entry.
disabled_tools: {}

# Child-agent concurrency and nesting limits.
subagents:
  # Maximum child-agent turns running across the process.
  max_concurrent: 64
  # Maximum child-agent turns running for one parent session.
  max_concurrent_per_parent: 16
  # Maximum number of nested child-agent levels.
  max_depth: 4

# Active built-in providers and their seeded model catalogues. Credential values
# are sourced from the configured environment variables or credential store.
providers:
  chatgpt:
    model_defaults:
      gpt-5.4: {}
      gpt-5.4-mini:
        name: GPT-5.4 Mini
      gpt-5.5: {}
      gpt-5.6-luna: {}
      gpt-5.6-terra: {}
      gpt-5.6-sol: {}
  openai:
    type: openai-compatible
    protocol: responses
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    header_timeout_ms: 10000
    model_defaults:
      gpt-5.4: {}
      gpt-5.4-mini:
        name: GPT-5.4 Mini
      gpt-5.5: {}
      gpt-5.6-luna: {}
      gpt-5.6-terra: {}
      gpt-5.6-sol: {}
  openrouter:
