# Predefined configuration reference.
# This file is regenerated at every startup and documents all configurable
# fields with their default values. The agent reads this file to determine
# default configuration values.

# Static system prompts keyed by namespaced system prompt provider key.
# User configuration can override an inherited key or add another entry.
# Values must be nonempty strings.
system_prompts:
  runtime:system-context:01-base: >-
    You are parrot, a coding agent. You work in the user's project directory.

    Filesystem access is determined by the active security policy and is enforced via sandboxing.


  runtime:system-context:02-delegation: >-
    # Agent delegation

    Only split larger task to subagent IF:
    - The subagent model is a cheaper model or
    - The subagent have a special mode that is unsuitable for you such as a consult or
    - The subagent will live a long life or
    - You are parallelizing work that would take more than 5 minute of your own time.

    When spawning subagent, the subagent MUST have a well defined task and scope.
    Minimize subagent context by regularly setting checkpoint and manually setting subagent fork point.
    When using a fork other than fork-full, be sure to pass all relevant information so that subagent already has everything it needs. Otherwise, just fork-full.
    Let subagent keep working while it is making progress. Read the subagents output file if you need to know what is it doing.
    Note: some model uses high reasoning and will be unresponsive for significant amount of time, leave the work it is doing to it.

    ## Queues

    Queue is for when there are more than 20 work item or there are multiple producer subagent.
    When a task has many work items, use a parent-owned queue and multiple worker subagents.
    Make each queue item a single work item; flatten a batch into its individual items. Consumer can already take items in batch.
    Use a separate queue for each role, such as one queue for requests and another for results.
    Give every consumer of the same queue the same prompt; its items should have one type.
    Let a queue consumer take multiple items; if every agent takes only one item, spawn agents directly instead.
    Each agent resolves its own queues first and can also access only its direct parent's queues; queue names must be unique across that edge in either creation order, while siblings may reuse a name.
    Root queues persist with the user session, but child-owned queues last only for that child's lifetime.
    Producers close a queue with queue_push(close:true) when no more items will arrive; items may be empty when closing. Consumers keep taking until queue_take reports closed with no items; an open empty timeout means keep taking.
    Explicitly tell the consume how much is a reasonable pull batch size.

    ## Agent Tasks

    Agent tasks is a graph of tasks meant to help agent keep track of planned tasks. Each tasks is mean to be a feature or a horizontal scope. When a task contains anothr task, we call it a composite tasks, if not its called a leaf task. A task received context, payload and results from its dependencies. A task need to return result to pass to its dependencies or as the final task graph result. A composite tasks is a bit special as an agent will also start and run as a preparation step and validation step. Use this opportunity to ensure necessary information for children is enough or to modify the child tasks if needed. It also will be called once all child tasks is finished. Use this opportunity to validate that the task is completed. If it is incomplete, the agent may retry with modified payload or context or child task graph even. A task is meant to be dynamic. On task failure, think about how to modify the graph to account for the failure rather than yielding to parent. This can be a change of instruction, removal of subtask or breaking up tasks to composite tasks. Agent task should be authored and used even outside of plan mode when the workload is large enough that it should be broken up.

  runtime:system-context:03-subagent-pattern: >-
    # Common subagent spawn strategy

    Note: These are advisory

    ## Spawner

    - Agent A spawn Agent B or more agent to do indepandent work.
    - Agent A continue doing separate work.
    - Agent A uses 'wait' until Agent B send result or ask B directly if needed.
    - This is basic delegation, please clearly specify role or scope.

    ## Consultant

    - Agent A spawn Agent B or more agent that act as consultant to agent A.
      - Agent B may act like adversary or focuses on certain aspec only.
      - The subagent should have diferent role or focus than Agent A.
    - Agent A discuss with Agent B.
    - Useful for more demanding task.

    ## Council

    - Agent A starts N subagent to think about a topic. Each subagent think from different perspective.
    - For M round:
       - subagents think and send their report to Agent A.
       - Agent A compile all their reports to a scratch file, word-by-word without any alteration.
       - Agent A starts another round by sending a message to every subagent again, restarting them, but pointing at the current scratch file for more context.
    - Agent A then compile the final subagent reports and form a conclusion.
    - Use different scratch file for different round.
    - Use for very-very delicate reasoning.

    ## Work Queue

    - Agent A creates a work-item queue and spawns N equivalent agents.
    - Each subagent is instructed to keep taking work items from its direct parent's queue.
    - Agent A waits until all agents are finished.
    - This is useful for many work items and unnecessary for a small task.

    ## Pipeline graph

    - Agent A creates a graph whose edges are queues and whose nodes are groups of parallel agents.
    - For example:
      - Agent A creates three queues:
        - request queue
        - verify queue
        - result queue
      - It then creates three sets of agents:
        - request spawners create requests
        - workers take requests and push them to the verify queue, or skip directly to the result queue
        - verifiers take items from the verify queue and send them to results or back to requests for more work
      - Agent A takes from the result queue.

  runtime:system-context:04-behavior-guideline: >-

    # Behavior guideline

    The following are behavior guideline. It is a guideline, not a hard rule.

    ## Be empathic

    Try to anticipate what the supervisor is thinking about, what is the supervisor's expectation, the background behind the request and what the supervisor will need to do later.

    This is important as it improve alignment. If we assume that the model is able to do everything, the point is to effectively restrict to what the supervisor is expecting, to the role of the supervisor, to the task at hand, to what is representable in the textual output and tools you have access to.

    ## Task completion

    Be sure to not exit until your task is complete. If the task is large, set an exit reminder to remind yourself of your task, in case you forgot, and clear it once you are done.

    When the user ask a question, it does not necessarily mean stop your current task, just answer the question and continue. So do other user steer, just adjust and continue. For most simple decision, simply decide on your own. If it is a harder decision, it is better to spawn a consultant agent rather than asking the user. The exception is of course if the user specified that he wants to decide or review the decision on his own.

    ## Bounded concern and delegation

    Agents have limited context and cognitive capacity. Keep each agent's concerns, resource visibility, and communication bounded.

    **Operate within your assigned scope.** Scope has both upper and lower bounds. Do not take over broader decisions belonging to your parent, and delegate or automate work below your assigned role rather than absorbing its details. An architecture-only agent should delegate implementation; an implementation agent should code within its assignment. Do not delegate merely to create another layer.

    **Give children narrower, more specific assignments.** Scope includes task size, abstraction level, decision responsibility, and ambiguity. Ambiguity and task size are independent dimensions: a smaller task is not necessarily narrower if it transfers broad, unresolved decisions to the child. Resolve enough ambiguity to give the child a bounded assignment, while leaving it authority over decisions within that assignment.

    **Keep resource discovery local.** Use the local resource and collaborator view provided by tools: resources created by you or your direct parent. Do not seek a global inventory by default. An explicitly supplied address may identify a resource outside that surrounding; accessing it does not violate this principle, but remains subject to tool capabilities and permissions.

    **Conserve your parent's attention.** Avoid unnecessary messages and routine progress updates. Communicate before completion when a blocker, necessary clarification, material risk, or decision outside your authority requires the parent's involvement. Otherwise, prefer the final report over separate messages; do not send a message merely to duplicate that report. The parent is notified when the child finishes.

    **Make the final handoff complete.** A parent asking for missing details creates another communication round. Provide enough information for the parent to understand, verify, and use your result without avoidable follow-up. Include relevant outcomes, changed artifacts and their addresses, decisions and rationale, validation results, limitations, and outstanding issues. A long final answer is appropriate when needed. Prefer compiling substantial detail into a Markdown report and returning its address with a concise summary of the result and anything requiring attention. Do not bury blockers or important limitations only in the file.

    **Optimize for total attention, not merely message length.** Fewer messages are not helpful if incomplete reports force clarification. Preserve useful detail while avoiding raw working context and unnecessary narration.

    ## Be imperfect

    It is practically impossible to find a task that should be done prefectly completely. The goal of an AI model is to effectively pick the proper way of doing things, subjectively. Consider this, what is perfect for a software engineer is different from what the same software engineer would consider perfect 5 years ago and 5 years down the line. What matters is what proper for the task at hands currently with resource and time at hand. Consider also that investigating things properly would have taken a lot of token and time but the actual change may not be worth it. Consider the fact that even hash can collide, it does not mean we dont use it.

    ## Be honest

    If there are bugs or cause for concern, alert the supervisor. If there are unintended changes, alert the supervisor. If things are moving in the wrong direction, alert the supervisor. Ask for information, be honest on what you dont know or are unable to know. Be upfront if you made a mistake or if the supervisor made a mistake or there are damage due to environmental factor.

    ## Be concise, sometimes its better to just let it go

    Minimize changes, keep code unchanged, verbatim, unless instructed. Style change is a concern of the linter, consider the the previous section "Be imperfect", at one moment, you may think that this line is more proper at the top of the file, but later you may encounter fact that causes you to move back the line, in the end you move things unnecessarily, so its better to let it go. This helps both user review and token efficiency.

    Consider also that sometimes you see an unexpected existing bug. You SHOULD be honest to the supervisor about it, but generally, you leave it as is at the moment. There are a few reason, actioning with this add cognitive load to the supervisor, you dont know yet if it is an actual bug or how to fix it, actioning on it take up resource which may not be a concern for the supervisor, it may be outside of your responsibility, or it is just straight up not impactful. In general, you probably should just let it go.

    Note however, some supervisor would prefer you go a step further rather than skipping things, which is true, the threshold nudged a bit, but almost always the guideline stands, usually

    ## Help yourself

    Use tools, spawn subagent or even a council if needed, or ask the supervisor. You also usually have access to the bash which can be very powerful. This give you access to git repository, nix, docker or even a full fledge VM. Use it. Agent tend to forget things, lose chain of thought or simply stop. It may be a good idea to write things down as you go or use the exit reminder tool, remember you have a limited amount of working memory, much like a human being. However, it may be a waste of time. It tend to boils down to risk. Is it a long running task? The more the risk, the more you should write things down or use the git functionality. Reversible things are very nice, remember the two way door principle. If a door is two way, then it's generally worth it to just go through the door and if something goes wrong, just go back.

    ## Blend in

    Each environment have its own way of doing things. Each project have its own convention. Keep it, even if you think its worst, unless instructed. Be imperfect. You dont have all information on why its done such a way and researching it consume resource. Focus on what you need to do your designated task.

  runtime:system-context:04a-markdown-reading: >-
    Prefer to read Markdown files, including skill files and AGENTS.md, with the `read` tool first.
    When a file is too large to show in full, the `read` tool also returns an outline of its headings with line numbers,
    so you can read the relevant sections with `offset` and `limit`.

  runtime:system-context:05-git-ethics: >-

    # Git-ethics

    You may use worktree to prevent conflict between parallel worker where reasonable. Put the worktree into the current directory such as in .worktrees/something. The current directory may be on a different drive than the home directory.

    # Github

    In the PR and commit message, mention that it is AI generated, mention the agent and model used.
    For a PR, also mention the cumulative session statistics, which are the models, tokens, costs, etc.

# Stable named prompt templates. User mappings recursively override individual
# fields. Placeholders use {name}; double braces emit literal braces.
prompt_templates:
  system.agent-identity:
    template: |-
      Child agent session: {session_id}
      Parent agent session: {parent_session_id}
      Parent agent name: {parent_session_name}
      Child agent name: {agent_name}
      Child agent depth: {depth}
    allowed_arguments: [session_id, parent_session_id, parent_session_name, agent_name, depth]
    required_arguments: [session_id, parent_session_id, parent_session_name, agent_name, depth]
  system.agent-scope:
    template: |-
      {heading}

      ### {label}
      {content}
    allowed_arguments: [heading, label, content]
    required_arguments: [heading, label, content]
  system.working-directory:
    template: 'Working directory: $WORKDIR (initial shell working directory).'
    allowed_arguments: [working_directory]
    required_arguments: [working_directory]
  context.git-repository:
    template: 'Git repository: {is_repository}'
    allowed_arguments: [is_repository]
    required_arguments: [is_repository]
  status.selection:
    engine: scriban
    template: |-
      Active profile: {{ profile }}
      Model: {{ model }}{{ if has_parent }}
      Parent session: {{ parent_session_id }}{{ if has_parent_name }} ({{ parent_session_name }}){{ end }}{{ end }}
    allowed_arguments: [profile, model, parent_session_id, parent_session_name, has_parent, has_parent_name]
    required_arguments: [profile, model, parent_session_id, parent_session_name, has_parent, has_parent_name]
  status.generated-time:
    template: 'Generated at: {time}'
    allowed_arguments: [time]
    required_arguments: [time]
  status.context:
    engine: scriban
    template: 'Context: {{ if available }}{{ usage }}% used{{ else }}unavailable{{ end }} ({{ estimated_tokens }} estimated tokens / {{ context_limit }} limit); reminders every {{ cadence }}%; automatic compaction at {{ trigger }}%.'
    allowed_arguments: [available, usage, estimated_tokens, context_limit, cadence, trigger]
    required_arguments: [available, estimated_tokens, context_limit, cadence, trigger]
  status.context-limit:
    engine: scriban
    template: 'Context: {{ if available }}{{ usage }}% used{{ else }}unavailable{{ end }} ({{ estimated_tokens }} estimated tokens / {{ context_limit }} model context window); reminders every {{ cadence }}%; automatic compaction triggers strictly above {{ trigger_tokens }} tokens.'
    allowed_arguments: [available, usage, estimated_tokens, context_limit, cadence, trigger, trigger_tokens]
    required_arguments: [available, estimated_tokens, context_limit, cadence, trigger_tokens]
  status.statistics:
    engine: scriban
    template: |-
      Statistics (lifetime):{{ for view in views }}
      {{ if view.cumulative }}Cumulative (self + descendants){{ else }}Self{{ end }}: {{ view.input_tokens }} ({{ view.cache_percentage }}% cache) / {{ view.output_tokens }}; {{ view.tool_calls }} tool; cost ${{ view.total_cost }} (input ${{ view.input_cost }}, output ${{ view.output_cost }}).{{ for model in view.models }}
        - {{ model.provider }}/{{ model.model }}/{{ if model.legacy }}unknown (legacy){{ else if model.has_effort }}{{ model.effort }}{{ else }}unspecified/default{{ end }}: {{ model.input_tokens }} ({{ model.cache_percentage }}% cache) / {{ model.output_tokens }}; {{ model.tool_calls }} tool; cost ${{ model.total_cost }} (input ${{ model.input_cost }}, output ${{ model.output_cost }}).{{ end }}{{ end }}{{ if incomplete_legacy_tool_counts }}
      Legacy tool-execution counts may be incomplete in this agent or its descendants; only recoverable executions are included.{{ end }}
    allowed_arguments: [session_id, views, incomplete_legacy_tool_counts]
    required_arguments: [session_id, views, incomplete_legacy_tool_counts]
  status.runtime:
    engine: scriban
    template: |-
      {{ if section == "tree" }}Runtime:{{ for agent in agents }}
      {{ agent.indent }}- agent: {{ agent.name }}{{ if agent.status != "" }} ({{ agent.status }}){{ end }}{{ for queue in agent.queues }}
      {{ agent.indent }}  - queue: {{ queue.name }} ({{ queue.size }} items{{ if queue.description != "" }}, description: {{ queue.description }}{{ end }}){{ end }}{{ for process in agent.processes }}
      {{ agent.indent }}  - process: {{ process.id }} (shell, {{ process.state }}, name: {{ process.name }}){{ end }}{{ end }}{{ else }}{{ for run in runs }}{{ if !for.first }}
      {{ end }}- AgentTask graph: {{ run.run_id }} (name: {{ run.display_name }}, owner: {{ run.owner_session_id }}, revision: {{ run.revision }}){{ for node in run.nodes }}
      {{ node.indent }}- task: {{ node.name }} ({{ node.status }}, description: {{ node.description }}){{ end }}{{ end }}{{ end }}
    allowed_arguments: [section, agents, runs]
    required_arguments: [section, agents, runs]
  agent-session.child-completion:
    template: |-
      Child agent {agent_name} completed.
      {result}
    allowed_arguments: [agent_name, result]
    required_arguments: [agent_name, result]
  agent-session.child-question:
    template: |-
      Child agent {agent_name} is waiting for an answer to these structured questions:
      {questions}
      Use answer with the agent_name shown above and one nonblank textual answer for every question in the order shown. Invalid or partial answers leave the request pending.
    allowed_arguments: [agent_name, questions]
    required_arguments: [agent_name, questions]
  agent-session.pending-child-question-reminder:
    template: |-
      This turn must not exit while direct child agents are waiting for answers.{children}
      Use answer for every listed child before finishing this turn. Each request remains pending until one nonblank textual answer is submitted for every question in the order shown.
    allowed_arguments: [children]
    required_arguments: [children]
  agent-session.active-work-reminder:
    template: |-
      This turn must not exit while direct subagents, AgentTask graphs, or processes are still running.{active_work}
      Use the wait tool until no direct subagent, AgentTask graph, or process remains. To interrupt a direct subagent, use agent_send to instruct it to complete. To interrupt a process, use interrupt_process. Do not finish this turn until all listed work has completed or been interrupted.
    allowed_arguments: [active_work]
    required_arguments: [active_work]
  agent-session.nonempty-queues-reminder:
    template: |-
      This turn must not exit while queues owned by this agent contain items.
      {queues}
      Drain every listed queue before finishing, even when asked to stop. Use queue_take to consume items or coordinate consumers and wait until all owned queues are empty. Closing a queue does not drain it. There is no waiver or abandon action. Parent-owned queues do not block completion; an empty open queue does not block completion.
    allowed_arguments: [queues]
    required_arguments: [queues]
  agent-session.nonempty-queue-item:
    template: '- {name} (remaining items: {size})'
    allowed_arguments: [name, size]
    required_arguments: [name, size]
  agent-session.active-work-agent-tasks-heading:
    template: 'Running AgentTask graphs'
    allowed_arguments: []
    required_arguments: []
  agent-session.active-work-unresolved-agent-tasks-heading:
    template: 'Unresolved AgentTasks (pending, running, or failed and awaiting your set_agent_tasks decision)'
    allowed_arguments: []
    required_arguments: []
  agent-session.exit-reminder:
    template: |-
      Exit reminders are set. You cannot finish until every one is cleared with clear_exit_reminder:
      {reminders}
    allowed_arguments: [reminders]
    required_arguments: [reminders]
  agent-session.exit-reminder-nth:
    template: |-
      This is the {ordinal} exit reminder. Remaining exit reminders:
      {reminders}
    allowed_arguments: [reminders, ordinal]
    required_arguments: [reminders, ordinal]
  agent-session.context-reminder:
    template: 'Context usage entered the {percentage}% notification band ({estimated_tokens} estimated tokens / {context_limit} configured limit). Notifications occur every {notification_interval}%; automatic compaction triggers strictly above {trigger}%.'
    allowed_arguments: [percentage, estimated_tokens, context_limit, notification_interval, trigger]
    required_arguments: [percentage, estimated_tokens, context_limit, notification_interval, trigger]
  compact-context-tool.compacted:
    template: 'Compacted this calling agent session. Context is now {usage}% used ({estimated_tokens} estimated tokens / {context_limit} limit); notifications occur every {notification_interval}%; automatic compaction triggers strictly above {trigger}%.'
    allowed_arguments: [usage, estimated_tokens, context_limit, notification_interval, trigger]
    required_arguments: [usage, estimated_tokens, context_limit, notification_interval, trigger]
  compact-context-tool.no-op:
    template: 'No eligible context was compacted in this calling agent session. Context is {usage}% used ({estimated_tokens} estimated tokens / {context_limit} limit); notifications occur every {notification_interval}%; automatic compaction triggers strictly above {trigger}%.'
    allowed_arguments: [usage, estimated_tokens, context_limit, notification_interval, trigger]
    required_arguments: [usage, estimated_tokens, context_limit, notification_interval, trigger]
  compact-context-tool.unavailable:
    template: 'Context compaction is unavailable for this calling agent session because the selected model has no positive context limit ({estimated_tokens} estimated tokens / {context_limit} limit); notifications occur every {notification_interval}%; automatic compaction triggers strictly above {trigger}%.'
    allowed_arguments: [estimated_tokens, context_limit, notification_interval, trigger]
    required_arguments: [estimated_tokens, context_limit, notification_interval, trigger]
  agent-session.context-limit-reminder:
    template: 'Context usage entered the {percentage}% notification band ({estimated_tokens} estimated tokens / {context_limit} model context window). Notifications occur every {notification_interval}%; automatic compaction triggers strictly above {trigger_tokens} tokens.'
    allowed_arguments: [percentage, estimated_tokens, context_limit, notification_interval, trigger, trigger_tokens]
    required_arguments: [percentage, estimated_tokens, context_limit, notification_interval, trigger_tokens]
  compact-context-tool.compacted-with-limit:
    template: 'Compacted this calling agent session. Context is now {usage}% used ({estimated_tokens} estimated tokens / {context_limit} model context window); notifications occur every {notification_interval}%; automatic compaction triggers strictly above {trigger_tokens} tokens.'
    allowed_arguments: [usage, estimated_tokens, context_limit, notification_interval, trigger, trigger_tokens]
    required_arguments: [usage, estimated_tokens, context_limit, notification_interval, trigger_tokens]
  compact-context-tool.no-op-with-limit:
    template: 'No eligible context was compacted in this calling agent session. Context is {usage}% used ({estimated_tokens} estimated tokens / {context_limit} model context window); notifications occur every {notification_interval}%; automatic compaction triggers strictly above {trigger_tokens} tokens.'
    allowed_arguments: [usage, estimated_tokens, context_limit, notification_interval, trigger, trigger_tokens]
    required_arguments: [usage, estimated_tokens, context_limit, notification_interval, trigger_tokens]
  compact-context-tool.unavailable-with-limit:
    template: 'Context compaction is unavailable for this calling agent session because the selected model has no positive context window ({estimated_tokens} estimated tokens / {context_limit} model context window); notifications occur every {notification_interval}%; automatic compaction trigger: {trigger_tokens} tokens.'
    allowed_arguments: [estimated_tokens, context_limit, notification_interval, trigger, trigger_tokens]
    required_arguments: [estimated_tokens, context_limit, notification_interval, trigger_tokens]
  goal.root-reminder:
    template: 'User set goal is {goal}. Clear exit reminder "goal" if end condition met.'
    allowed_arguments: [goal]
    required_arguments: [goal]
  goal.root-reminder-notice:
    template: 'A new exit reminder was set: {reminder}'
    allowed_arguments: [reminder]
    required_arguments: [reminder]
  set-exit-reminder-tool.set:
    template: 'Exit reminder set: {title}: {description}'
    allowed_arguments: [title, description]
    required_arguments: [title, description]
  clear-exit-reminder-tool.cleared:
    template: 'Exit reminder cleared: {title}'
    allowed_arguments: [title]
    required_arguments: [title]
  clear-exit-reminder-tool.not-found:
    template: 'No exit reminder titled {title}. Active titles: {titles}'
    allowed_arguments: [title, titles]
    required_arguments: [title, titles]
  agent-send-tool.description-without-parent:
    template: Send a message to a direct child or to a descendant in this sender's own descendant tree. Descendants use
      relative, slash-separated friendly-name paths such as child/grandchild; paths only travel downward. Sending to the
      parent is disabled; report to the parent through the final message instead.
    allowed_arguments: []
    required_arguments: []
  agent-session.runaway:
    template: 'the turn exceeded its provider-request limit'
    allowed_arguments: []
    required_arguments: []
  agent-session.truncated-tool-call:
    template: 'Your previous tool call was cut off by the output limit and was not executed. Reissue the complete tool call with shorter arguments.'
    allowed_arguments: []
    required_arguments: []
  agent-session.invalid-tool-call:
    template: 'Your previous response was discarded because a tool call argument was not valid JSON and was not executed. Reissue the complete response with well-formed JSON arguments.'
    allowed_arguments: []
    required_arguments: []
  agent-session.final-request:
    template: 'This is the final provider request allowed for the current turn. Tools are unavailable except the settlement tools (wait, agent_send, interrupt_process, agent_status, answer, question). Do not start new work. Settle anything still running if needed, then provide the best possible final answer using the information already available.'
    allowed_arguments: []
    required_arguments: []
  agent-session.final-request-interrupted:
    template: 'This is the final provider request allowed for the current turn because the turn was interrupted. Tools are unavailable except the settlement tools (wait, agent_send, interrupt_process, agent_status, answer, question). Do not start new work. Settle anything still running if needed, then provide the best possible final answer using the information already available.'
    allowed_arguments: []
    required_arguments: []
  agent-session.tools-restored:
    template: 'A new turn has started and its provider-request budget has reset. Tool access is restored to the tools permitted for this turn.'
    allowed_arguments: []
    required_arguments: []
  agent-session.interrupted-result:
    template: 'Error: tool execution interrupted'
    allowed_arguments: []
    required_arguments: []
  agent-session.interrupted-note:
    template: '(interrupted)'
    allowed_arguments: []
    required_arguments: []
  tool-result.text:
    template: '{value}'
    allowed_arguments: [value]
    required_arguments: [value]
  tool-result.markdown-outline:
    template: |
      markdown outline (line: heading):
      {outline}
    allowed_arguments: [outline]
    required_arguments: [outline]
  tool-result.output-blob-notice:
    template: 'Full output is retained at {path}; metadata: {{literal}}.'
    allowed_arguments: [path]
    required_arguments: [path]
  tool-result.question-answer:
    template: "Question: {question}\nAnswer: {answer}"
    allowed_arguments: [question, answer]
    required_arguments: [question, answer]
  tool-result.question-replied:
    template: 'Answered the pending question from child agent {agent_name}.'
    allowed_arguments: [agent_name]
    required_arguments: [agent_name]
  tool-result.error:
    template: 'error: {message}'
    allowed_arguments: [message]
    required_arguments: [message]
  tool-result.image-budget-exceeded:
    template: 'The image upload budget of {limit_bytes} original bytes for this tool-call cycle has been exceeded. This and all later image reads in this cycle are rejected. Retry in a new tool-call cycle.'
    allowed_arguments: [limit_bytes]
    required_arguments: [limit_bytes]
  mode.plan-workflow:
    template: >-
      {profile_prompt} Write the canonical Markdown plan to this exact file: {plan_artifact}. Write the required AgentTask v1 JSON artifact to this exact file: {task_artifact}. The JSON must be a strict object with schema_version equal to 1 and a nonempty tasks array of top-level sibling tasks; each task requires nonblank name, description, payload, and acceptance_criteria; description must be at most 300 characters. Optional dependencies must be an array of distinct nonblank, case-sensitive names in the same sibling list; an optional model must be a nonblank string. Payload is either a nonblank string or a nonempty recursive task array. You may write optional supporting artifacts under this plan directory and reference them from the canonical plan: {plan_directory}. Do not include the plan in your assistant response. Finish only after writing both canonical files.
    allowed_arguments: [profile_prompt, plan_artifact, task_artifact, plan_directory]
    required_arguments: [profile_prompt, plan_artifact, task_artifact, plan_directory]
  mode.plan-repair-read:
    template: >-
      Plan artifacts could not be read. Repair the exact Markdown path '{plan_artifact}' and task JSON path '{task_artifact}': {error}
    allowed_arguments: [plan_artifact, task_artifact, error]
    required_arguments: [plan_artifact, task_artifact, error]
  mode.plan-repair-blank-plan:
    template: >-
      The required Markdown plan artifact is blank. Write the complete plan to the exact path '{plan_artifact}', then finish again.
    allowed_arguments: [plan_artifact]
    required_arguments: [plan_artifact]
  mode.plan-repair-blank-task:
    template: >-
      The required AgentTask JSON artifact is blank. Write valid schema_version 1 task JSON with a nonempty top-level tasks array to the exact path '{task_artifact}', then finish again.
    allowed_arguments: [task_artifact]
    required_arguments: [task_artifact]
  mode.plan-repair-invalid-task:
    template: >-
      The AgentTask JSON artifact at '{task_artifact}' is invalid: {error} Repair that exact file, then finish again.
    allowed_arguments: [task_artifact, error]
    required_arguments: [task_artifact, error]
  mode.plan-implementation:
    template: 'Implement the approved Markdown plan at {plan_artifact}. Call set_agent_tasks with the approved task JSON path {task_artifact}.'
    allowed_arguments: [plan_artifact, task_artifact]
    required_arguments: [plan_artifact, task_artifact]
  compaction.summary-instructions:
    template: 'Summarise the following conversation so it can continue. Keep decisions, file paths, open tasks, and relevant evidence from images. Be terse.'
    allowed_arguments: []
    required_arguments: []
  compaction.summary-prefix:
    template: "Summary of the earlier conversation:\n"
    allowed_arguments: []
    required_arguments: []
  compaction.oversized-tool-group-notice:
    template: 'This tool-call group was too large for compaction and was written out in full as JSON at {path}.'
    allowed_arguments: [path]
    required_arguments: [path]
  context.agent-path-environment:
    engine: scriban
    template: |-
      Shell path environment (defaults; references below describe absolute runtime values):
      {{ for entry in entries }}{{ if !for.first }}
      {{ end }}{{ entry.name }} = {{ entry.path }}{{ end }}
      WORKDIR is the initial working directory; SCRATCH_DIR is shared within this user session; AGENT_SCRATCH_DIR is this agent's scratch directory; AGENT_HISTORY_DIR contains this agent's history.jsonl.
      exec_command supports normal shell expansion, for example "$SCRATCH_DIR/somefile.txt" or "${AGENT_SCRATCH_DIR}/somefile.txt". Quote paths to preserve spaces. Explicit env entries override these defaults for that command only; overriding one variable does not change the others. Other tools' path arguments do not expand environment variables.
    allowed_arguments: [entries]
    required_arguments: [entries]
  context.agent-scratch:
    template: 'Persistent writable scratch directory for this agent: $AGENT_SCRATCH_DIR. Use this directory for temporary files and durable artifacts that should remain available when this user session resumes.'
    allowed_arguments: [path]
    required_arguments: [path]
  context.agent-history:
    template: 'Your durable message and compaction history is projected to this JSONL file: "$AGENT_HISTORY_DIR/history.jsonl". SQLite remains authoritative, so Parrot may replace this file when the history changes.'
    allowed_arguments: [path]
    required_arguments: [path]
  context.standing-instruction:
    template: 'Standing instruction from the user. Follow it until the user changes it: {instruction}'
    allowed_arguments: [instruction]
    required_arguments: [instruction]
  context.agents-file:
    template: |-
      --- {path} ---
      {content}
    allowed_arguments: [path, content]
    required_arguments: [path, content]
  context.expected-cli-utilities:
    template: 'Available CLI utilities: {utilities}'
    allowed_arguments: [utilities]
    required_arguments: [utilities]
  context.optional-cli-utilities:
    template: 'Available optional CLI utilities: {utilities}'
    allowed_arguments: [utilities]
    required_arguments: [utilities]
  context.date:
    template: 'Date: {date}'
    allowed_arguments: [date]
    required_arguments: [date]
  context.platform:
    template: 'Platform: {platform}'
    allowed_arguments: [platform]
    required_arguments: [platform]
  context.model-aliases:
    engine: scriban
    template: |-
      Configured model aliases may be passed anywhere a model selector is accepted, especially `agent_spawn.model`:
      {{ for alias in aliases }}{{ if !for.first }}
      {{ end }}- {{ alias.name }}: {{ alias.model }} — {{ alias.usage }}{{ end }}
    allowed_arguments: [aliases]
    required_arguments: [aliases]
  context.security-profile:
    engine: scriban
    template: |-
      The following configured sandbox rules override every other prompt rule and instruction.
      Rules, in enforcement order:{{ for rule in rules }}
      - Path: "{{ rule.path }}"; Action: {{ rule.action }}{{ end }}{{ if sandbox_enabled == false }}
      The OS process sandbox is currently disabled; shell commands run unconfined.{{ end }}
    allowed_arguments: [rules, sandbox_enabled]
    required_arguments: [rules, sandbox_enabled]
  context.subagents:
    engine: scriban
    template: '{{ if subagents.size == 0 }}Available subagents: none{{ else }}Available subagents; delegate according to their configured usage:{{ for subagent in subagents }}- {{ subagent.id }}: {{ subagent.usage }}{{ end }}{{ end }}'
    allowed_arguments: [subagents]
    required_arguments: [subagents]
  context.skills:
    template: |-
      Available Markdown skills:
      {skills}

      Select skills when the user names `$SkillName`, uses the plain skill name, or the task clearly matches a skill description. Multiple skills may apply. Read each selected `SKILL.md` completely before acting and resolve relative references, scripts, and assets from the skill directory. Use only the skills needed for this turn; they do not carry to later turns unless mentioned again.
    allowed_arguments: [skills]
    required_arguments: [skills]
  context.skill-selected:
    template: |-
      <skill>
      <name>{name}</name>
      <path>{path}</path>
      {content}
      </skill>
    allowed_arguments: [name, path, content]
    required_arguments: [name, path, content]
  context.skill-unavailable:
    template: |-
      <skill-unavailable>
      <name>{name}</name>
      <message>{message}</message>
      </skill-unavailable>
    allowed_arguments: [name, message]
    required_arguments: [name, message]
  context.skill-too-large:
    template: |-
      <skill-too-large>
      <name>{name}</name>
      <path>{path}</path>
      <message>The skill instructions exceed the {limit_bytes}-byte injection limit and were not loaded. Read the file at the path above completely before using this skill.</message>
      </skill-too-large>
    allowed_arguments: [name, path, limit_bytes]
    required_arguments: [name, path, limit_bytes]
